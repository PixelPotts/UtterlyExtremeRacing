  50%       { opacity: 0; }

<script>
(function(){
  const canvas = document.getElementById('loader-canvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
  const fs = `
  precision highp float;
  uniform float uTime;
  uniform vec2 uRes;
  #define TAU 6.2831853
  #define PI 3.1415927
  void main(){
    vec2 fc=gl_FragCoord.xy;
    vec2 uv=(fc-uRes*.5)/uRes.y;
    float t=uTime*.65;
    float r=length(uv);
    float a=atan(uv.y,uv.x);
    // tunnel depth warp
    float z=0.14/(r+.0001);
    float tv=fract(z-t*1.5);
    float tu=fract(a/TAU+.5+t*.05);
    // grid lines
    float lZ=step(.90,fract(tv*14.));
    float lA=step(.86,fract(tu*8.));
    float grid=max(lZ,lA);
    // plasma
    float pl=sin(uv.x*9.+t*1.6)+sin(uv.y*8.2-t*1.2)+sin((uv.x+uv.y)*7.1+t*.9)+sin(r*14.-t*2.9);
    pl=pl*.25+.5;
    // scanline shimmer
    float scan=.93+.07*sin(fc.y*2.8+t*11.);
    // palette: cyan, magenta, orange
    vec3 cC=vec3(0.,1.,.9);
    vec3 cM=vec3(1.,0.,.7);
    vec3 cO=vec3(1.,.65,.0);
    vec3 pC=mix(cC,cM,sin(pl*TAU)*.5+.5);
    pC=mix(pC,cO,sin(pl*TAU*1.4+t*.6)*.35+.35);
    vec3 col=pC*pl*.3;
    // tunnel grid glow — brighter near center
    float cD=clamp(z*.45,0.,1.3);
    float gFlash=.4+.6*(sin(t*5.5+tv*22.)*.5+.5);
    col+=grid*mix(cC,cM,sin(t*2.+tu*3.)*.5+.5)*cD*gFlash;
    // radial speed streaks
    float sA=sin((a+t*.18)*14.)*.5+.5;
    col+=pow(sA,12.)*smoothstep(.48,.0,r)*cC*1.4;
    // glowing core burst
    col+=.055/(r*r+.003)*mix(cO,cM,sin(t*2.4)*.5+.5);
    // chromatic ripple rings
    float rings=sin(r*30.-t*4.2)*.5+.5;
    col+=rings*.06*pC;
    // outer vignette
    col*=1.-smoothstep(.32,.88,r)*.92;
    col*=scan;
    col=pow(clamp(col,0.,1.),vec3(.72));
    gl_FragColor=vec4(col,1.);
  }`;
  function mkShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aLoc=gl.getAttribLocation(prog,'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);
  const uT=gl.getUniformLocation(prog,'uTime');
  const uR=gl.getUniformLocation(prog,'uRes');
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;gl.viewport(0,0,canvas.width,canvas.height);}
  resize();
  window.addEventListener('resize',resize);
  const t0=performance.now();
  let raf;
  function draw(){
    const ldr=document.getElementById('loader');
    if(!ldr||ldr.style.display==='none')return;
    gl.uniform1f(uT,(performance.now()-t0)/1000);
    gl.uniform2f(uR,canvas.width,canvas.height);
    gl.drawArrays(gl.TRIANGLES,0,3);
    raf=requestAnimationFrame(draw);
  }
  draw();
  window._stopLoaderShader=()=>cancelAnimationFrame(raf);
})();
</script>

<script type="module">
import * as THREE from 'three';

import { SEGMENT_TYPES, ZONE_PROBS,
         KERB_NONE, KERB_RED_WHITE, KERB_CONCRETE, KERB_DIRT } from './assets/segments.js';
import { SEGMENT_TYPES_L2 }                                    from './assets/segments_l2.js';

import { Walker } from './assets/walker.js';
import { Sky } from './assets/sky.js';
import { DialogSystem }   from './assets/dialog.js';

import { LEVEL1_INTRO }   from './assets/stories/level1_intro.js';
import { LEVEL1_MISSION } from './assets/missions/level1.js';

// ── Live-tunable parameters (editable via Options screen) ──────────────────
const PARAMS = window.PARAMS = {
  // Gameplay
  respawn: true,
  // Truck follow
  anchorBase:    28,   anchorAmp1:    10,   anchorFreq1:   0.25,
  anchorAmp2:    4,    anchorFreq2:   0.58, followCorrect: 0.35,
  throwMin:      2.4,  throwRand:     2.0,
  // Grenade aim
  flightTimeMin: 1.3,  flightTimeRand: 0.5, gravity:      12,
  leadDist:      0,    spreadLat:     3.5,  spreadFwd:    3.5,
  // Grenade spawn
  spawnOffset:   3.4,  spawnJitter:   0.8,  spawnHeight:  2.1,
};

const PARAM_DEFS = [
  { section: 'GAMEPLAY' },
  { key: 'respawn', label: 'respawn after falling off road', type: 'bool' },
  { section: 'TRUCK FOLLOW' },
  { key: 'anchorBase',    label: 'anchor base (m)',      min: 5,    max: 100, step: 1    },
  { key: 'anchorAmp1',    label: 'wave 1 amplitude',     min: 0,    max: 30,  step: 0.5  },
  { key: 'anchorFreq1',   label: 'wave 1 frequency',     min: 0.01, max: 2,   step: 0.01 },
  { key: 'anchorAmp2',    label: 'wave 2 amplitude',     min: 0,    max: 20,  step: 0.5  },
  { key: 'anchorFreq2',   label: 'wave 2 frequency',     min: 0.01, max: 2,   step: 0.01 },
  { key: 'followCorrect', label: 'follow correction',    min: 0.01, max: 2,   step: 0.01 },
  { key: 'throwMin',      label: 'throw interval min s', min: 0.5,  max: 15,  step: 0.1  },
  { key: 'throwRand',     label: 'throw interval rand s',min: 0,    max: 10,  step: 0.1  },
  { section: 'GRENADE AIM' },
  { key: 'flightTimeMin',  label: 'flight time min s',   min: 0.3,  max: 5,   step: 0.1  },
  { key: 'flightTimeRand', label: 'flight time rand s',  min: 0,    max: 3,   step: 0.1  },
  { key: 'gravity',        label: 'gravity',             min: 1,    max: 40,  step: 0.5  },
  { key: 'leadDist',       label: 'lead trim (m)',        min: -30,  max: 60,  step: 1    },
  { key: 'spreadLat',      label: 'spread lateral (m)',  min: 0,    max: 20,  step: 0.5  },
  { key: 'spreadFwd',      label: 'spread fwd/back (m)', min: 0,    max: 20,  step: 0.5  },
  { section: 'GRENADE SPAWN' },
  { key: 'spawnOffset',  label: 'spawn offset (m)',      min: 0,    max: 10,  step: 0.1  },
  { key: 'spawnJitter',  label: 'spawn jitter',          min: 0,    max: 3,   step: 0.1  },
  { key: 'spawnHeight',  label: 'spawn height (m)',      min: 0.5,  max: 5,   step: 0.1  },
];

const RW         = 14;   // road width (normal)
const SLEN       = 13;   // segment length (m)
const SPD        = 0.10; // segments/frame base
const ACCEL = SPD * 2.2;  // 0 → max in ~0.45s
const BRAKE = SPD * 5.0;  // full stop in ~0.2s
const DRAG  = SPD * 0.6;  // coast deceleration
const AHEA       = 130;  // road segments generated ahead
const DECO_AHEAD = 65;   // decoration segments built ahead (less than AHEA)
const KEEP       = 28;   // segments behind
const ZONE_MIN_SEGS = 16;  // ~208 m min per zone
const ZONE_MAX_SEGS = 54;  // ~702 m max per zone
const LANES      = [-10.5, -3.5, 3.5, 10.5]; // lane center offsets (perpendicular)
const BOOST_DUR  = 1.5;  // seconds of launch boost

// ── Renderer ──────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3E4A52);
scene.fog = new THREE.Fog(0x3E4A52, 55, 210);
const cam = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);

// ── Lights ─────────────────────────────────────────────
const ambLight = new THREE.AmbientLight(0x8AAABB, 0.08 * Math.PI);
scene.add(ambLight);
const sun = new THREE.DirectionalLight(0xB0C4CC, 0.04 * Math.PI);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 450;
sun.shadow.camera.left = sun.shadow.camera.bottom = -200;
sun.shadow.camera.right = sun.shadow.camera.top   =  200;
scene.add(sun); scene.add(sun.target);


// ── Clouds ─────────────────────────────────────────────
const cloudGroup = new THREE.Group();
const cloudMat = new THREE.MeshLambertMaterial({ color: 0x6A7880, transparent: true, opacity: 0.82 });
for (let c = 0; c < 18; c++) {
  const cloud = new THREE.Group();
  const parts = 3 + (Math.random() * 4 | 0);
  for (let j = 0; j < parts; j++) {
    const s = 10 + Math.random() * 18;
    const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 7, 5), cloudMat);
    puff.position.set((Math.random()-.5)*22, (Math.random()-.5)*6, (Math.random()-.5)*18);
    puff.scale.y = 0.32;
    cloud.add(puff);
  }
  cloud.position.set((Math.random()-.5)*380, 52 + Math.random()*30, (Math.random()-.5)*380);
  cloudGroup.add(cloud);
}
scene.add(cloudGroup);

// ── Rain ───────────────────────────────────────────────
const RAIN_COUNT = 2200;
const rainArr = new Float32Array(RAIN_COUNT * 6);
for (let i = 0; i < RAIN_COUNT; i++) {
  const x = (Math.random()-.5)*140, z = (Math.random()-.5)*140, y = Math.random()*55;
  rainArr[i*6]=x; rainArr[i*6+1]=y;   rainArr[i*6+2]=z;
  rainArr[i*6+3]=x+.3; rainArr[i*6+4]=y-1.4; rainArr[i*6+5]=z;
}

// ── Animated black water — procedural DataTexture normal map, scrolled per frame ─
// Two-frequency sine pattern baked into a 256×256 RGBA DataTexture.
// Scrolling the UV offset each frame creates cheap, reliable wave animation
// that goes through Three.js's standard normal-map pipeline.
const _waterUniforms = { uTime: { value: 0 } };
const _waterNormalMap = (() => {
  const S = 256;
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = (x / S) * Math.PI * 2, v = (y / S) * Math.PI * 2;
      // Two frequencies: large swells + small chop
      const nx = Math.sin(u * 4)       * 0.55 + Math.sin(v * 3.1 + u * 1.3) * 0.35;
      const ny = Math.cos(v * 3.7)     * 0.55 + Math.cos(u * 2.9 + v * 1.7) * 0.35;
      const i = (y * S + x) * 4;
      d[i]   = Math.round(Math.min(255, Math.max(0, (nx * 0.44 + 0.5) * 255)));
      d[i+1] = Math.round(Math.min(255, Math.max(0, (ny * 0.44 + 0.5) * 255)));
      d[i+2] = 210;   // Z — mostly up
      d[i+3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(14, 9);   // ~4–5 m per wave tile on a 62 m water strip
  t.needsUpdate = true;
  return t;
})();

// ── Stochastic tiling — world-position hash, breaks per-segment UV repeat ──
function addStochasticTiling(mat) {
  mat.onBeforeCompile = shader => {
    // Vertex: emit world XZ as a varying
    shader.vertexShader = shader.vertexShader
      .replace('void main() {', 'varying vec3 vWorldPos;\nvoid main() {')
      .replace('#include <worldpos_vertex>',
        '#include <worldpos_vertex>\nvWorldPos = (modelMatrix * vec4(position,1.0)).xyz;');

    // Fragment: hash-based 4-tap bilinear blend keyed on world position
    shader.fragmentShader = shader.fragmentShader
      .replace('void main() {', `varying vec3 vWorldPos;
vec2 _h2(vec2 p){p=fract(p*vec2(234.34,435.345));p+=dot(p,p+34.23);return fract(vec2(p.x*p.y,p.x+p.y));}
vec4 _stoch(sampler2D s,vec2 uv){
  vec2 wp=vWorldPos.xz*0.10, i=floor(wp), f=fract(wp), bl=f*f*(3.0-2.0*f);
  return mix(
    mix(texture2D(s,uv+_h2(i)),            texture2D(s,uv+_h2(i+vec2(1,0))),bl.x),
    mix(texture2D(s,uv+_h2(i+vec2(0,1))), texture2D(s,uv+_h2(i+vec2(1,1))),bl.x),
  bl.y);
}
void main() {`)
      .replace('texture2D( map, vMapUv )', '_stoch( map, vMapUv )')
      .replace(
        'texture2D( normalMap, vNormalMapUv ).xyz * 2.0 - 1.0',
        '_stoch( normalMap, vNormalMapUv ).xyz * 2.0 - 1.0'
      );
  };
  mat.customProgramCacheKey = () => 'stochastic';
}

function tickZone() {

// ── Road Path ──────────────────────────────────────────
const path = [];
let pAng=0, pTgt=0, pTimer=0, pCurve=.05;
let pHeightY=0, pHeightVel=0, pTargetY=0;
const pPos = new THREE.Vector3();

function genPt() {
  if (curZone === 'bridge') {
    pTgt = pAng;   // freeze heading — bridge biome is always straight
  } else {
    if (pTimer > 0) { pTimer--; }
    else {
      if (Math.random() < .32) { pTgt = pAng*.12; pCurve=.04; pTimer=20+(Math.random()*42|0); }
      else { pTgt=(Math.random()-.5)*Math.PI*.65; pCurve=.05+Math.random()*.08; pTimer=10+(Math.random()*22|0); }
    }
  }
  pAng += (pTgt - pAng) * pCurve;
  pPos.x += Math.sin(pAng) * SLEN;
  pPos.z -= Math.cos(pAng) * SLEN;

  // Hills — spring to random targets; per-biome amplitude + stiffness
  if (curZone === 'trees' || curZone === 'dirt') {
    const A = curZone === 'dirt' ? 10 : 4;    // amplitude: dirt steeper, trees gentler
    const K = curZone === 'dirt' ? 0.022 : 0.012; // stiffness: dirt snappier
    // Re-target when close to current target (natural hill crests/troughs)
    if (Math.abs(pHeightY - pTargetY) < 0.4)
      pTargetY = (Math.random() * 2 - 1) * A;
    pHeightVel += (pTargetY - pHeightY) * K;
    pHeightVel *= 0.82;                        // damping
    pHeightY   += pHeightVel;
  } else {
    // Decay smoothly back to flat when leaving hilly biome
    pHeightVel *= 0.80;
    pHeightY   += (0 - pHeightY) * 0.06 + pHeightVel;
    if (Math.abs(pHeightY) < 0.05) { pHeightY = 0; pHeightVel = 0; }
  }
  pPos.y = pHeightY;

  path.push({ pos: pPos.clone(), angle: pAng });
  tickZone();
  // Inject intersection segments every ~300 m in city biome
  if (curZone === 'buildings') {
    _citySegCount++;
    if (_citySegCount % INTERSECTION_EVERY === 0)
      zoneTypes[zoneTypes.length - 1] = 'intersection';
  } else {
    _citySegCount = 0;
  }
}

function getFloorY(x, z, nearSeg) {
  _ray.ray.origin.set(x, 200, z);
  const meshes = [];
  for (let s = (nearSeg - 8) | 0; s <= (nearSeg + 8) | 0; s++) {
    const c = _collidables.get(s);
    if (c) for (const m of c) meshes.push(m);
  }
  if (!meshes.length) return -Infinity;
  const hits = _ray.intersectObjects(meshes, false);
  return hits.length ? hits[0].point.y : -Infinity;
}

function quad(x0,z0,x1,z1,x2,z2,x3,z3, y0, y1, mat) {
  const g = new THREE.BufferGeometry();

// Curved kerb: arched cross-section (inner edge → peak → outer edge)
function buildKerb(ix0, iz0, ox0, oz0, ix1, iz1, ox1, oz1, mat, { N=5, BASE=0.42, PEAK=0.28, y0=0, y1=0 }={}) {
  const verts = [], uvs = [];
  for (let s = 0; s <= 1; s++) {
    for (let t = 0; t <= N; t++) {
      const tf = t / N;
      const x = s === 0 ? ix0 + (ox0-ix0)*tf : ix1 + (ox1-ix1)*tf;
      const z = s === 0 ? iz0 + (oz0-iz0)*tf : iz1 + (oz1-iz1)*tf;
      const baseY = s === 0 ? y0 : y1;
      const y = baseY + BASE + PEAK * Math.sin(Math.PI * tf);
      verts.push(x, y, z); uvs.push(tf, s);
    }
  }
  const idx = [], st = N + 1;
  for (let t = 0; t < N; t++) idx.push(t, st+t, t+1, t+1, st+t, st+t+1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true; m.castShadow = true;
  scene.add(m); return m;
}

function buildSeg(i) {
  if (segs[i] || !path[i+1]) return;
  const { pos: p0, angle: a0 } = path[i];
  const { pos: p1, angle: a1 } = path[i+1];
  const px0=Math.cos(a0), pz0=Math.sin(a0);
  const px1=Math.cos(a1), pz1=Math.sin(a1);
  const hw=segWidth(i)/2, kw=1.1;
  const _seg = _segTypes[zoneTypes[i]] ?? _segTypes.start ?? SEGMENT_TYPES.trees;
  const roadMat = M[_seg.roadMat];

  const ry0 = p0.y, ry1 = p1.y;
  const road = quad(
    p0.x-px0*hw, p0.z-pz0*hw, p0.x+px0*hw, p0.z+pz0*hw,
    p1.x-px1*hw, p1.z-pz1*hw, p1.x+px1*hw, p1.z+pz1*hw,
    ry0+.4, ry1+.4, roadMat);
  const kerbCtx = { M, buildKerb: (ix0,iz0,ox0,oz0,ix1,iz1,ox1,oz1, mat, opts={}) =>
    buildKerb(ix0,iz0,ox0,oz0,ix1,iz1,ox1,oz1, mat, { ...opts, y0: ry0, y1: ry1 }) };
  // Left kerb: inner→outer sweeps left, winding is correct
  const kL = _seg.kerb.build(
    p0.x-px0*hw, p0.z-pz0*hw, p0.x-px0*(hw+kw), p0.z-pz0*(hw+kw),
    p1.x-px1*hw, p1.z-pz1*hw, p1.x-px1*(hw+kw), p1.z-pz1*(hw+kw), i, kerbCtx);
  // Right kerb: swap inner/outer so winding stays upward-facing
  const kR = _seg.kerb.build(
    p0.x+px0*(hw+kw), p0.z+pz0*(hw+kw), p0.x+px0*hw, p0.z+pz0*hw,
    p1.x+px1*(hw+kw), p1.z+pz1*(hw+kw), p1.x+px1*hw, p1.z+pz1*hw, i, kerbCtx);
  let dash = null;
  if ((i&1)===0) {
    const mx=(p0.x+p1.x)*.5, mz=(p0.z+p1.z)*.5, dw=.28;
    dash = quad(p0.x-px0*dw,p0.z-pz0*dw, p0.x+px0*dw,p0.z+pz0*dw, mx-px0*dw,mz-pz0*dw, mx+px0*dw,mz+pz0*dw, ry0+.45, (ry0+ry1)*.5+.45, M.dash);
  }
  segs[i] = [road, kL, kR, dash].filter(Boolean);
  if (_seg.roadMat !== 'splitGap') addCollidable(i, road, kL, kR);
}

function dropSeg(i) {
  if (!segs[i]) return;
  dropCollidable(i);
  segs[i].forEach(m => { scene.remove(m); m.geometry.dispose(); });
  delete segs[i];
}

      group:    b.group,          // THREE.Group — used for interior attachment & cleanup
      def,                        // building def with w/h/d (may have enterable:true added)
      groundY:  pathY + 0.4,      // world Y of ground floor
      interior: null,             // BuildingInterior — built lazily on intent
      intentDot: null,            // green debug dot mesh above door
    });
  }
  return b.group;
}

function spawnLightPost(x, z, angle, side, si) {
  const pathY = path[si]?.pos.y ?? 0;
  const poleH = 6.2, armLen = 1.8;
  // Group rooted at base — rotation here tips the whole pole when hit
  const grp = new THREE.Group();
  grp.position.set(x, pathY + 0.45, z);
  grp.userData.isPole    = true;
  grp.userData.hitRadius = 0.13;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.12, poleH, 7), M.pole);
  pole.position.set(0, poleH * 0.5, 0);
  pole.castShadow = true;
  grp.add(pole);
  // Lamp arm offset in group-local space
  const lax = -side * Math.cos(angle) * armLen;
  const laz = -side * Math.sin(angle) * armLen;
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.30, 7, 4), M.lampHead);
  lamp.position.set(lax, poleH, laz);
  lamp.scale.y = 0.45;
  grp.add(lamp);
  scene.add(grp);
  // Register world lamp position for pooled PointLight; store grp so downed poles lose their light
  if (!streetLightPosts.has(si)) streetLightPosts.set(si, []);
  streetLightPosts.get(si).push({ x: x + lax, y: pathY + 0.45 + poleH, z: z + laz, grp });
  return [grp];
}

// ── Neon pole (Level 2) — tall matte-black post, small neon lamp head ────────
const _neonPoleMat      = new THREE.MeshLambertMaterial({ color: 0x0a0a0a });
const _neonLampMat      = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
const _splitLampBlueMat = new THREE.MeshBasicMaterial({ color: 0x0088ff });
const _splitLampOrgMat  = new THREE.MeshBasicMaterial({ color: 0xff6600 });
function spawnNeonPole(x, z, angle, side, si) {
  const pathY = path[si]?.pos.y ?? 0;
  const poleH = 9.5, armLen = 2.2;
  const arr = [];
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, poleH, 7), _neonPoleMat);
  pole.position.set(x, pathY + 0.45 + poleH * 0.5, z);
  pole.castShadow = true; scene.add(pole); arr.push(pole);
  const ax = x - side * Math.cos(angle) * armLen;
  const az = z - side * Math.sin(angle) * armLen;
  const lampY = pathY + 0.45 + poleH;
  // Horizontal arm
  const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, armLen, 5), _neonPoleMat);
  armMesh.rotation.z = Math.PI / 2;
  armMesh.position.set((x + ax) * 0.5, lampY, (z + az) * 0.5);
  scene.add(armMesh); arr.push(armMesh);
  // Lamp sphere
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 4), _neonLampMat);
  lamp.position.set(ax, lampY, az);
  scene.add(lamp); arr.push(lamp);
  // Tight downward SpotLight — use pool in L2 (fixed count), create directly in L1
  if (_neonLightPool) {
    const slot = _neonLightPool.acquireSpot(ax, lampY, az, ax, pathY, az);
    // Tag the pole mesh so dropDecorations can release the slot
    pole.userData.neonPoolSlot = slot;
  } else {
    const sl = new THREE.SpotLight(0x00ff88, 900, 32, Math.PI / 9, 0.18, 1.6);
    sl.castShadow = false;
    sl.position.set(ax, lampY, az);
    sl.target.position.set(ax, pathY, az);
    sl.target.updateMatrixWorld();
    scene.add(sl); scene.add(sl.target);
    arr.push(sl, sl.target);
  }
  return arr;
}

function _spawnSplitPole(x, z, angle, side, si, lampMat, pool, slotKey) {
  const pathY = path[si]?.pos.y ?? 0;
  const poleH = 9.5, armLen = 2.2;
  const arr = [];
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, poleH, 7), _neonPoleMat);
  pole.position.set(x, pathY + 0.45 + poleH * 0.5, z);
  pole.castShadow = true; scene.add(pole); arr.push(pole);
  const ax = x - side * Math.cos(angle) * armLen;
  const az = z - side * Math.sin(angle) * armLen;
  const lampY = pathY + 0.45 + poleH;
  const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, armLen, 5), _neonPoleMat);
  armMesh.rotation.z = Math.PI / 2;
  armMesh.position.set((x + ax) * 0.5, lampY, (z + az) * 0.5);

function spawnSplitPoleBlue(x, z, angle, side, si) {
  return _spawnSplitPole(x, z, angle, side, si, _splitLampBlueMat, _splitLightPoolBlue, 'splitPoolSlotBlue');
}
function spawnSplitPoleOrange(x, z, angle, side, si) {

function spawnTunnel(si) {
  const { pos: p0, angle } = path[si];
  const { pos: p1 } = path[si+1] ?? path[si];
  const mid = new THREE.Vector3().lerpVectors(p0, p1, .5);
  const px=Math.cos(angle), pz=Math.sin(angle);
  const tHW = RW/2+1.1+.5, wallH=5.5, wallT=1.0, segLen=SLEN+2;
  const ry = -angle;
  const baseY = mid.y + 0.4;   // road surface Y at this segment
  const arr = [];
  const box = (gx,gy,gz, w,h,d) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M.tunnel);
    m.position.set(gx, gy, gz); m.rotation.y = ry;
    m.castShadow = m.receiveShadow = true; scene.add(m); arr.push(m);
  };
  box(mid.x-px*(tHW+wallT*.5), baseY+wallH*.5,        mid.z-pz*(tHW+wallT*.5), wallT, wallH, segLen);
  box(mid.x+px*(tHW+wallT*.5), baseY+wallH*.5,        mid.z+pz*(tHW+wallT*.5), wallT, wallH, segLen);
  box(mid.x,                   baseY+wallH+wallT*.5,  mid.z,                   (tHW+wallT)*2, wallT, segLen);

  // Light strips: ceiling + side walls, 30 cm wide, 200 cm center-to-center
  const STRIP = 0.30, PERIOD = 2.00;
  const fw_x = Math.sin(angle), fw_z = -Math.cos(angle);
  const addStrip = (gx, gy, gz, w, h, d) => {
    const s = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.tunnelLight);
    s.position.set(gx, gy, gz); s.rotation.y = ry;
    scene.add(s); arr.push(s);
  };
  if (!tunnelStripPosts.has(si)) tunnelStripPosts.set(si, []);
  for (let t = -(segLen*0.5 - STRIP*0.5); t < segLen*0.5; t += PERIOD) {
    const sx = mid.x + t*fw_x, sz = mid.z + t*fw_z;
    const ceilY = baseY + wallH - 0.02;
    addStrip(sx, ceilY,              sz, (tHW-0.15)*2, 0.04, STRIP);
    addStrip(sx - px*(tHW-0.02), baseY+wallH*0.5, sz - pz*(tHW-0.02), 0.04, wallH, STRIP);
    addStrip(sx + px*(tHW-0.02), baseY+wallH*0.5, sz + pz*(tHW-0.02), 0.04, wallH, STRIP);
    tunnelStripPosts.get(si).push({ x: sx, y: ceilY, z: sz });
  }
  return arr;
}

function spawnBridge(si) {
  const { pos: p0, angle } = path[si];
  const p1pos = path[si+1]?.pos ?? p0;
  const mid = { x: (p0.x + p1pos.x) * 0.5, z: (p0.z + p1pos.z) * 0.5 };
  const px = Math.cos(angle), pz = Math.sin(angle);
  const fw_x = Math.sin(angle), fw_z = -Math.cos(angle);
  const segLen = SLEN + 2;
  const ry = -angle;
  const arr = [];

  // Deck Y follows actual path height — road quad is always at pathY + 0.4
  const deckY0 = p0.y    + 0.4;
  const deckY1 = p1pos.y + 0.4;
  const midDeckY = (deckY0 + deckY1) * 0.5;

  const WATER_Y  = -10.0;
  const WATER_HW = 1500;             // extends well past any render distance
  const WALL_HW  = RW / 2 + 22;     // endcap/side-wall half-width (visible range only)

  // ── Water (opaque deep-blue, renderOrder -2 — first in depth buffer) ──────
  const waterMesh = quad(
    p0.x    - px*WATER_HW, p0.z    - pz*WATER_HW,
    p0.x    + px*WATER_HW, p0.z    + pz*WATER_HW,
    p1pos.x - px*WATER_HW, p1pos.z - pz*WATER_HW,
    p1pos.x + px*WATER_HW, p1pos.z + pz*WATER_HW,
    WATER_Y, WATER_Y, M.water
  );
  waterMesh.renderOrder = -2;
  arr.push(waterMesh);

  // ── Depth mask (invisible, just below deck, renderOrder -1) ──────────────
  // Writes depth before water renders so nothing bleeds through the deck.
  {
    const MY = midDeckY - 0.35;  // just below the road surface
    const mg = new THREE.BufferGeometry();
    mg.setAttribute('position', new THREE.Float32BufferAttribute([
      p0.x    - px*WATER_HW, MY, p0.z    - pz*WATER_HW,
      p0.x    + px*WATER_HW, MY, p0.z    + pz*WATER_HW,
      p1pos.x - px*WATER_HW, MY, p1pos.z - pz*WATER_HW,
      p0.x    + px*WATER_HW, MY, p0.z    + pz*WATER_HW,
      p1pos.x + px*WATER_HW, MY, p1pos.z + pz*WATER_HW,
      p1pos.x - px*WATER_HW, MY, p1pos.z - pz*WATER_HW,
    ], 3));
    mg.computeVertexNormals();
    const mm = new THREE.Mesh(mg, bridgeMaskMat);
    mm.renderOrder = -1;
    scene.add(mm); arr.push(mm);
  }

  // ── Concrete endcap faces — one at zone entry, one at zone exit only ──────
  const isEntry = zoneTypes[si - 1] !== 'bridge';
  const isExit  = zoneTypes[si + 1] !== 'bridge';
  for (const [ep, epDeckY, show] of [[p0, deckY0, isEntry], [p1pos, deckY1, isExit]]) {
    if (!show) continue;
    const wallH = epDeckY - WATER_Y;
    const face = new THREE.Mesh(new THREE.BoxGeometry(WALL_HW * 2, wallH, 0.6), M.sidewalk);
    face.position.set(ep.x, epDeckY - wallH * 0.5, ep.z);
    face.rotation.y = ry;
    face.receiveShadow = true;
    scene.add(face); arr.push(face);
  }

  // ── Jersey barriers on road edges ─────────────────────────────────────────
  const BARRIER_H = 0.90, BARRIER_W = 0.36;
  const barrierDist = RW / 2 + BARRIER_W * 0.5 + 0.08;
  for (let s = -1; s <= 1; s += 2) {
    const bx = mid.x + px * s * barrierDist;
    const bz = mid.z + pz * s * barrierDist;
    const barrier = new THREE.Mesh(new THREE.BoxGeometry(BARRIER_W, BARRIER_H, segLen), M.sidewalk);
    barrier.position.set(bx, midDeckY + BARRIER_H * 0.5, bz);
    barrier.rotation.y = ry;
    barrier.castShadow = barrier.receiveShadow = true;
    scene.add(barrier); arr.push(barrier);
  }

  // ── Towers every 12 segments (~156 m apart) ───────────────────────────────
  const TOWER_SPACING = 12;
  if (si % TOWER_SPACING === 0) {
    const TOWER_H = 42, TOWER_W = 2.2, TOWER_D = 3.2;
    const towerDist   = RW / 2 + BARRIER_W + 1.8;
    const CABLE_PEAK  = midDeckY + TOWER_H * 0.96;
    const CABLE_FLOOR = midDeckY + 4.6;
    const ROAD_DECK   = midDeckY + 1.4;
    const cableSpan   = SLEN * TOWER_SPACING;

    for (let s = -1; s <= 1; s += 2) {
      const tx = mid.x + px * s * towerDist;
      const tz = mid.z + pz * s * towerDist;

      // Tower shaft
      const shaft = new THREE.Mesh(new THREE.BoxGeometry(TOWER_W, TOWER_H, TOWER_D), M.bridgeTower);
      shaft.position.set(tx, midDeckY + TOWER_H * 0.5, tz);
      shaft.rotation.y = ry;
      shaft.castShadow = shaft.receiveShadow = true;
      scene.add(shaft); arr.push(shaft);

      // Portal cross-braces
      for (let b = 0; b < 2; b++) {
        const by = midDeckY + TOWER_H * (0.50 + b * 0.24);
        const brace = new THREE.Mesh(new THREE.BoxGeometry(TOWER_W * 0.55, TOWER_H * 0.024, TOWER_D * 1.9), M.bridgeTower);
        brace.position.set(tx, by, tz);
        brace.rotation.y = ry;
        scene.add(brace); arr.push(brace);
      }

      // Main suspension cable — peaks at tower, sags to CABLE_FLOOR at midspan
      const NUM_PTS = 30;
      const cablePoints = [];
      for (let i = 0; i <= NUM_PTS; i++) {
        const t = i / NUM_PTS;
        const cx = tx + fw_x * (t - 0.5) * cableSpan;
        const cz = tz + fw_z * (t - 0.5) * cableSpan;
        const sinF = Math.sin(Math.PI * t);
        cablePoints.push(new THREE.Vector3(cx, CABLE_FLOOR + (CABLE_PEAK - CABLE_FLOOR) * sinF * sinF, cz));
      }
      const cableCurve = new THREE.CatmullRomCurve3(cablePoints);
      const cableMesh = new THREE.Mesh(new THREE.TubeGeometry(cableCurve, 36, 0.24, 7, false), M.bridgeCable);
      cableMesh.castShadow = true;
      scene.add(cableMesh); arr.push(cableMesh);

      // Hanger cables — long near towers, short near midspan
      const NUM_HANGERS = 20;
      for (let h = 0; h < NUM_HANGERS; h++) {
        const t = (h + 1) / (NUM_HANGERS + 1);
        const hx = tx + fw_x * (t - 0.5) * cableSpan;
        const hz = tz + fw_z * (t - 0.5) * cableSpan;
        const sinF = Math.sin(Math.PI * t);
        const topY = CABLE_FLOOR + (CABLE_PEAK - CABLE_FLOOR) * sinF * sinF;
        const hangerLen = topY - ROAD_DECK;
        if (hangerLen > 1.5) {
          const hanger = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, hangerLen, 4), M.bridgeCable);
          hanger.position.set(hx, ROAD_DECK + hangerLen * 0.5, hz);
          scene.add(hanger); arr.push(hanger);
        }
      }
    }
  }

  return arr;
}

// ── Tree-zone terrain ─────────────────────────────────────────────────────────
// Generates rolling ground meshes emanating from both road edges.
// Heights are computed in world space so adjacent segments tile seamlessly.
function spawnTerrain(si, mat) {
  if (!path[si + 1]) return [];
  const { pos: p0, angle: a0 } = path[si];
  const { pos: p1, angle: a1 } = path[si + 1];
  const hw   = segWidth(si) / 2;
  const kw   = 1.1;
  const edge = hw + kw;    // lateral dist from center to terrain inner edge
  const TW   = 80 + Math.min(si * 0.24, 140); // 80→220 m with distance
  const FADE = 14;         // ease-in zone width: 0→full amplitude over this distance
  const NX   = 12;         // lateral vertex strips
  const NZ   = 2;          // longitudinal vertex strips per 13 m segment
  const PI2  = Math.PI * 2;
  const px0  = Math.cos(a0), pz0 = Math.sin(a0);
  const px1  = Math.cos(a1), pz1 = Math.sin(a1);
  // Terrain inner edge height matches outer kerb edge (BASE=0.42 above pathY)
  const roadH0 = p0.y + 0.42;
  const roadH1 = p1.y + 0.42;
  const meshes = [];

  for (const side of [-1, 1]) {
    const verts = [], uvs = [], idx = [];

    for (let j = 0; j <= NZ; j++) {
      const tf  = j / NZ;
      const bx  = p0.x + (p1.x - p0.x) * tf;
      const bz  = p0.z + (p1.z - p0.z) * tf;
      const bH  = roadH0 + (roadH1 - roadH0) * tf;

      for (let i = 0; i <= NX; i++) {
        const lf  = i / NX;
        const lat = edge + lf * TW;
        const pxt = px0 + (px1 - px0) * tf;
        const pzt = pz0 + (pz1 - pz0) * tf;
        const wx  = bx + pxt * side * lat;
        const wz  = bz + pzt * side * lat;

        // Smooth fade (smoothstep) from road edge to full terrain amplitude
        const ft   = Math.min(1, (lat - edge) / FADE);
        const fade = ft * ft * (3 - 2 * ft);

        // Low-frequency, high-amplitude hills in world space (seamless across segs)
        const dh =
          6.5 * Math.sin(wx * PI2 / 110 + 0.70) * Math.cos(wz * PI2 / 130 + 1.20) +
          3.2 * Math.sin(wx * PI2 /  55 + 2.10) * Math.cos(wz * PI2 /  60 + 3.40) +
          1.6 * Math.sin(wx * PI2 /  28 + 4.50) * Math.cos(wz * PI2 /  32 + 0.80);

        verts.push(wx, bH + fade * dh, wz);
        uvs.push(lf * 5, tf * 1.5);
      }
    }

    // Build quads — winding differs per side so normals point +Y
    for (let j = 0; j < NZ; j++) {
      for (let i = 0; i < NX; i++) {
        const a = j * (NX + 1) + i, b = a + 1;
        const c = (j + 1) * (NX + 1) + i, d = c + 1;
        if (side > 0) idx.push(a, b, c, b, d, c);
        else          idx.push(a, c, b, c, d, b);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs,   2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mat ?? M.ground);
    mesh.receiveShadow = true;
    scene.add(mesh);
    meshes.push(mesh);
  }

  return meshes;
}

// ── Dirt-zone rock clumps ──────────────────────────────────────────────────
// Stochastic clumps of low-poly rocks placed on both sides of the dirt road.
function spawnDirtRocks(si) {
  if (!path[si + 1]) return [];
  const { pos, angle } = path[si];
  const px  = Math.cos(angle), pz = Math.sin(angle);
  const fx  = Math.sin(angle), fz = -Math.cos(angle);
  const hw  = segWidth(si) / 2;
  const edge = hw + 1.1;
  const arr = [];

  for (const side of [-1, 1]) {
    // ~70% chance a clump appears on this side this segment
    if (Math.random() > 0.70) continue;

    // Primary clump
    const cd   = edge + 3 + Math.random() * 32;
    const cf   = (Math.random() - 0.5) * SLEN * 1.2;
    const cx   = pos.x + px * side * cd + fx * cf;
    const cz   = pos.z + pz * side * cd + fz * cf;
    const n    = 2 + (Math.random() * 5 | 0);
    for (let k = 0; k < n; k++) {
      const sp = 1.8 + Math.random() * 4.5;
      const a  = Math.random() * Math.PI * 2;
      arr.push(spawnRock(
        cx + Math.cos(a) * sp * (0.4 + Math.random()),
        pos.y,
        cz + Math.sin(a) * sp * (0.4 + Math.random()),
        0.45 + Math.random() * 1.8,
      ));
    }

    // Optional satellite clump nearby
    if (Math.random() < 0.42) {
      const dx = (Math.random() - 0.5) * 14;
      const dz = (Math.random() - 0.5) * 14;
      const n2 = 1 + (Math.random() * 3 | 0);
      for (let k = 0; k < n2; k++) {
        const sp = 1.0 + Math.random() * 3;
        const a  = Math.random() * Math.PI * 2;
        arr.push(spawnRock(
          cx + dx + Math.cos(a) * sp,
          pos.y,
          cz + dz + Math.sin(a) * sp,
          0.3 + Math.random() * 0.9,
        ));
      }
    }
  }
  return arr;
}

function _spawnManhole(si) {
  const { pos, angle } = path[si];
  const px = Math.cos(angle), pz = Math.sin(angle);
  const fx = Math.sin(angle), fz = -Math.cos(angle);
  if (lastManholePos) {
    const dx = pos.x - lastManholePos.x, dz = pos.z - lastManholePos.z;
    if (dx*dx + dz*dz < 20*20) return;
  }
  const side = Math.random() < 0.5 ? -1 : 1;
  const dist = 2.5 + Math.random() * 3.5;
  const fwd  = (Math.random() - 0.5) * SLEN * 0.5;
  const x = pos.x + px * side * dist + fx * fwd;
  const z = pos.z + pz * side * dist + fz * fwd;
  lastManholePos = { x, z };
  manholeCounter++;
  const obs = new ManholeObstacle(scene, si, x, z, manholeCounter % 5 === 0, playManholeBlast, pos.y);
  (obstaclesBySeg[si] ??= []).push(obs);
  obstacles.push(obs);
}

function _spawnOilSpill(si) {
  const { pos, angle } = path[si];
  const fx = Math.sin(angle), fz = -Math.cos(angle);
  const px = Math.cos(angle), pz = Math.sin(angle);
  const lat = (Math.random() - 0.5) * RW * 0.65;
  const fwd = (Math.random() - 0.5) * SLEN * 0.5;
  const x   = pos.x + px * lat + fx * fwd;
  const z   = pos.z + pz * lat + fz * fwd;
  const obs = new OilSpillObstacle(scene, si, x, z, angle, pos.y);
  (obstaclesBySeg[si] ??= []).push(obs);
  obstacles.push(obs);
}

function _spawnPedestrians(si) {
  if (!path[si]) return;
  const { pos, angle } = path[si];
  const px = Math.cos(angle), pz = Math.sin(angle);
  const fx = Math.sin(angle), fz = -Math.cos(angle);
  const kOuter  = RW * 0.5 + 1.1;          // ~8.1 m from road center
  const swOuter = kOuter + 4.5;             // ~12.6 m
  const swInner = kOuter + 0.55;            // clear of kerb
  for (let s = -1; s <= 1; s += 2) {
    const n = Math.random() < 0.55 ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const lat = s * (swInner + Math.random() * (swOuter - swInner - 0.6));
      const fwd = (Math.random() - 0.5) * SLEN * 1.6;
      const wx  = pos.x + px * lat + fx * fwd;
      const wz  = pos.z + pz * lat + fz * fwd;
      const dir = Math.random() < 0.5 ? 1 : -1;
      const obs = new PedestrianObstacle(scene, si, wx, wz, dir, angle, pos.y);
      (obstaclesBySeg[si] ??= []).push(obs);
      obstacles.push(obs);
    }
  }
}

// ── Neon cube obstacle (Level 2) ─────────────────────────────────────────────
function _spawnNeonCube(si) {
  if (!path[si]) return;
  const { pos, angle } = path[si];
  const px   = Math.cos(angle), pz  = Math.sin(angle);   // perpendicular to road
  const fx   = Math.sin(angle), fz  = -Math.cos(angle);  // forward along road
  const side = Math.random() < 0.5 ? 1 : -1;             // random left or right half
  const lat  = side * (RW * 0.27);                        // ~3.8 m from centre = mid of half-lane
  const fwd  = SLEN * 0.55;                               // slightly past segment start
  const x    = pos.x + px * lat + fx * fwd;
  const z    = pos.z + pz * lat + fz * fwd;
  const y    = pos.y + 0.4 + 1.25;                        // road surface + half cube height
  const obs  = new NeonCubeObstacle(scene, si, x, y, z, angle, _neonLightPool);
  (obstaclesBySeg[si] ??= []).push(obs);
  obstacles.push(obs);
}

// ── Traffic lights ──────────────────────────────────────────────────────────
function applyPhase(inter) {
  const p = inter.phase;
  for (const sig of inter.mainSigs) {
    sig.red.material    = (p >= 2) ? LMAT.redOn    : LMAT.redOff;
    sig.yellow.material = (p === 1) ? LMAT.yellowOn : LMAT.yellowOff;
    sig.green.material  = (p === 0) ? LMAT.greenOn  : LMAT.greenOff;
  }
  for (const sig of inter.crossSigs) {
    sig.red.material    = (p < 2)  ? LMAT.redOn    : LMAT.redOff;
    sig.yellow.material = (p === 3) ? LMAT.yellowOn : LMAT.yellowOff;
    sig.green.material  = (p === 2) ? LMAT.greenOn  : LMAT.greenOff;
  }
}

function spawnIntersectionLights(si, pos, angle) {
  const meshes = [];
  const fx = Math.sin(angle), fz = -Math.cos(angle);
  const px = Math.cos(angle), pz =  Math.sin(angle);
  const hw       = RW / 2;
  const crossExt = RW + 4;   // matches IntersectionSegment
  const ry  = pos.y + 0.4;
  const pH  = 5.5;   // pole height

  function makePole(fwd, lat) {
    const wx = pos.x + fx*fwd + px*lat;
    const wz = pos.z + fz*fwd + pz*lat;

    // Pole cylinder
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, pH, 6), _TPOLE_MAT);
    pole.position.set(wx, ry + pH*0.5, wz);
    scene.add(pole); meshes.push(pole);

    // Horizontal arm pointing toward intersection center
    const dx = pos.x - wx, dz = pos.z - wz;
    const dlen = Math.sqrt(dx*dx + dz*dz);
    const armLen = Math.min(dlen * 0.65, 2.2);
    const ndx = dx / dlen, ndz = dz / dlen;

    const armGrp = new THREE.Group();
    armGrp.position.set(wx, ry + pH + 0.05, wz);
    armGrp.rotation.y = Math.atan2(ndx, ndz);
    const armCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, armLen, 5), _TPOLE_MAT);
    armCyl.rotation.x = Math.PI / 2;
    armCyl.position.z = armLen * 0.5;
    armGrp.add(armCyl);
    scene.add(armGrp); meshes.push(armGrp);

    // Housing box at arm tip
    const hx = wx + ndx * armLen, hz = wz + ndz * armLen;
    const housing = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.82, 0.30), _TBOX_MAT);
    housing.position.set(hx, ry + pH - 0.38, hz);
    scene.add(housing); meshes.push(housing);

    // Light spheres: red (top), yellow (mid), green (bot)
    const hy = ry + pH - 0.10;
    const redSph    = new THREE.Mesh(_LIGHT_GEO, LMAT.redOn);
    const yellowSph = new THREE.Mesh(_LIGHT_GEO, LMAT.yellowOff);
    const greenSph  = new THREE.Mesh(_LIGHT_GEO, LMAT.greenOff);
    redSph.userData.sharedGeo    = true;
    yellowSph.userData.sharedGeo = true;
    greenSph.userData.sharedGeo  = true;
    redSph.position.set(hx,       hy,        hz);
    yellowSph.position.set(hx,    hy - 0.27, hz);
    greenSph.position.set(hx,     hy - 0.54, hz);
    scene.add(redSph); scene.add(yellowSph); scene.add(greenSph);
    meshes.push(redSph, yellowSph, greenSph);

    return { red: redSph, yellow: yellowSph, green: greenSph };
  }

  // 2 main road poles — far (ahead) side of intersection
  const mainSigs = [
    makePole(hw + 1.6, -(hw + 2.2)),
    makePole(hw + 1.6,   hw + 2.2),
  ];
  // 2 cross road poles — far side of each cross road approach
  const crossSigs = [
    makePole(-(hw + 2.2), crossExt + 1.6),
    makePole(  hw + 2.2,  crossExt + 1.6),
  ];

  intersections.set(si, { phase: 0, timer: PHASE_DUR[0], mainSigs, crossSigs });
  return meshes;
}

function addDecorations(si) {
  if (decorSeg[si] || !path[si]) return;
  const seg = _segTypes[zoneTypes[si]];

  // Inject mission spawn if one is pending for this segment
  const mSpawn = MissionSystem.drainSpawns(si);
  if (mSpawn) segCtx.missionOverride = { si, stageId: mSpawn.stageId, props: mSpawn.props, _applied: false, _side: null };

  decorSeg[si] = seg ? seg.buildMeshes(si, segCtx) : [];

  // Register or requeue after buildMeshes
  if (mSpawn) {
    if (segCtx.missionOverride._applied) {
      const mBldg = decorSeg[si].find(o => o.userData.missionId === mSpawn.stageId);
      if (mBldg) MissionSystem.registerSpawned(mSpawn.stageId, si, { x: mBldg.position.x, z: mBldg.position.z });
    } else {
      // No viable building in this segment — try the next one
      MissionSystem.requeueSpawn(si, mSpawn);
    }
    delete segCtx.missionOverride;
  }
  // Sidewalk / pavement quads tagged collidable in buildMeshes
  const taggedC = decorSeg[si].filter(m => m?.userData?.collidable);
  if (taggedC.length) addCollidable(si, ...taggedC);
  // Building wall-collision OBB cache
  const bldgs = decorSeg[si].filter(o => o?.userData?.isBuilding);
  if (bldgs.length) {
    if (!_wallBoxes.has(si)) _wallBoxes.set(si, []);
    const wb = _wallBoxes.get(si);
    for (const g of bldgs)
      wb.push({ x: g.position.x, z: g.position.z, hw: g.userData.hw, hd: g.userData.hd, ry: g.rotation.y,
                enterable: !!g.userData.enterable, side: g.userData.side ?? 1, doorHW: g.userData.doorHW ?? 0.9 });
  }
  // Biome-specific ground terrain (trees, etc.)
  if (seg?.buildGround) {
    const ground = seg.buildGround(si, segCtx);
    if (ground.length) { decorSeg[si].push(...ground); addCollidable(si, ...ground); }
  }
  if (seg?.hasObstacles) {
    _spawnManhole(si);
    citySegForOil++;
    if (citySegForOil % 3 === 0) _spawnOilSpill(si);
  }
  if (seg?.hasPedestrians) _spawnPedestrians(si);
  if (zoneTypes[si] === 'neonRoad' && si > 10 && si % 8 === 0) _spawnNeonCube(si);

}

function dropDecorations(si) {
  if (!decorSeg[si]) return;
  if (MissionSystem.isLocked(si)) return;   // keep until stage complete

  // Clean up any enterable buildings belonging to this segment
  const segObjs = new Set(decorSeg[si]);
  for (let i = _enterableBuildings.length - 1; i >= 0; i--) {
    const eb = _enterableBuildings[i];
    if (segObjs.has(eb.group)) {
      if (eb.interior)   eb.interior.dispose(eb.group);
      if (eb.intentDot)  scene.remove(eb.intentDot);
      _enterableBuildings.splice(i, 1);
    }
  }

  decorSeg[si].forEach(o => {
    scene.remove(o);
    if (o?.userData?.neonPoolSlot        && _neonLightPool)        _neonLightPool.release(o.userData.neonPoolSlot);
    if (o?.userData?.splitPoolSlotBlue   && _splitLightPoolBlue)   _splitLightPoolBlue.release(o.userData.splitPoolSlotBlue);
    if (o?.userData?.splitPoolSlotOrange && _splitLightPoolOrange) _splitLightPoolOrange.release(o.userData.splitPoolSlotOrange);
    if (!o.userData.sharedGeo) o.traverse(c => { if (c.isMesh) c.geometry.dispose(); });
  });
  streetLightPosts.delete(si);
  tunnelStripPosts.delete(si);
  intersections.delete(si);
  delete decorSeg[si];
  _wallBoxes.delete(si);
  // Dispose obstacles belonging to this segment
  if (obstaclesBySeg[si]) {
    for (const obs of obstaclesBySeg[si]) {
      obs.dispose();
      obstacles.splice(obstacles.indexOf(obs), 1);
    }
    delete obstaclesBySeg[si];
  }
}

const Reticle = {
  armLen: 12,
  armW:   2,
  gap:    5,
  color:  'rgba(255,255,255,0.88)',
  boxW:   0.55,   // fraction of viewport width for constraint rect
  boxH:   0.45,   // fraction of viewport height
  el:     null,
  x:      0,
  y:      0,
  normX:  0,
  normY:  0,

  init() {
    this.el = document.createElement('div');
    this.el.style.cssText = 'position:fixed;pointer-events:none;z-index:5000;transform:translate(-50%,-50%)';
    const { armLen: L, armW: W, gap: G, color: C } = this;
    for (const [l, t, w, h] of [
      [-(G+L), -W/2,   L, W  ],   // left
      [  G,    -W/2,   L, W  ],   // right
      [-W/2,  -(G+L),  W, L  ],   // top
      [-W/2,    G,     W, L  ],   // bottom
    ]) {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute;background:${C};left:${l}px;top:${t}px;width:${w}px;height:${h}px`;
      this.el.appendChild(d);
    }
    document.body.appendChild(this.el);
    this.x = innerWidth / 2;
    this.y = innerHeight / 2;
    this._place();
    window.addEventListener('mousemove', e => this._onMove(e));
  },

  _onMove(e) {
    const hw = innerWidth  * this.boxW / 2;
    const hh = innerHeight * this.boxH / 2;
    const cx = innerWidth  / 2;
    const cy = innerHeight / 2;
    this.x = Math.max(cx - hw, Math.min(cx + hw, e.clientX));
    this.y = Math.max(cy - hh, Math.min(cy + hh, e.clientY));
    this.normX = (this.x - cx) / hw;
    this.normY = (this.y - cy) / hh;
    this._place();
  },

  _place() {
    this.el.style.left = this.x + 'px';
    this.el.style.top  = this.y + 'px';
  },
};

function _buildOptionsPanel() {
  optionsPanel.innerHTML = '';
  const back = document.createElement('div');
  back.className = 'opt-back';
  back.textContent = '← BACK';
  back.onclick = _optionsBack;
  optionsPanel.appendChild(back);
  for (const def of PARAM_DEFS) {
    if (def.section) {
      const h = document.createElement('div');
      h.className = 'opt-section';
      h.textContent = def.section;
      optionsPanel.appendChild(h);
      continue;
    }
    const row = document.createElement('div');
    row.className = 'opt-row';
    const lbl = document.createElement('label');
    lbl.textContent = def.label;
    const inp = document.createElement('input');
    if (def.type === 'bool') {
      inp.type = 'checkbox';
      inp.checked = !!PARAMS[def.key];
      inp.style.cssText = 'width:18px;height:18px;cursor:pointer;accent-color:#0ff';
      inp.addEventListener('change', () => { PARAMS[def.key] = inp.checked; });
    } else {
      inp.type = 'number';
      inp.min = def.min; inp.max = def.max; inp.step = def.step;
      inp.value = PARAMS[def.key];
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value);
        if (!isNaN(v)) PARAMS[def.key] = v;
      });
    }
    row.appendChild(lbl); row.appendChild(inp);
    optionsPanel.appendChild(row);
  }
}

function _optionsBack() {
  optionsPanel.style.display = 'none';
  document.getElementById('esc-inner').style.display = '';

  if (action === 'restart') location.reload();
  if (action === 'options') {
    _buildOptionsPanel();
    document.getElementById('esc-inner').style.display = 'none';
    optionsPanel.style.display = 'block';
  }
}

  escMenu.classList.add('open');

}

async function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const load = url => new Promise((res, rej) => {
    if (_audioPre[url]) { actx.decodeAudioData(_audioPre[url].slice(0), res, rej); return; }
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url); xhr.responseType = 'arraybuffer';
    xhr.onload  = () => actx.decodeAudioData(xhr.response, res, rej);
    xhr.onerror = rej;
    xhr.send();
  });
  try {
    [aBufs.engLo, aBufs.engHi, aBufs.thunder, aBufs.squeal] = await Promise.all([
      load('assets/sfx/engine_lo.ogg'),
      load('assets/sfx/engine_hi.ogg'),
      load('assets/sfx/thunder.ogg'),
      load('assets/sfx/tire_squeal.ogg'),
    ]);
  } catch(e) { console.error('Audio load failed:', e); return; }

  // Vehicles handle their own audio subgraphs
  player.initAudio(actx, aBufs);
  aiCars.forEach(ai => ai.initAudio(actx, aBufs));
  if (boxTruck) boxTruck.initAudio(actx, aBufs);
  if (killBot)  killBot.initAudio(actx, aBufs);

  // Tire squeal — volume driven by player drift intensity in frame loop
  if (aBufs.squeal && !_squealSrc) {
    _squealSrc = actx.createBufferSource();
    _squealSrc.buffer = aBufs.squeal;
    _squealSrc.loop   = true;
    _squealGain = actx.createGain();
    _squealGain.gain.value = 0;
    _squealSrc.connect(_squealGain);
    _squealGain.connect(actx.destination);
    _squealSrc.start();
  }
}

    const on = s % 2 === 0;
    const NORM = sky.normalBg;
    scene.background.setHex(on ? FLASH : NORM);
    scene.fog.color.setHex(on ? FLASH : NORM);
    s++;
    if (s < flashes * 2) { setTimeout(tick, on ? 65 : 105); }
    else {
      sky.restore();
      setTimeout(() => {
        if (!actx || !aBufs.thunder) return;
        const src = actx.createBufferSource();
        src.buffer = aBufs.thunder;
        const g = actx.createGain(); g.gain.value = 0.85;
        src.connect(g); g.connect(actx.destination); src.start();
      }, 500 + Math.random() * 1800);
    }
  })();
  thunderTimer = 18 + Math.random() * 30;
}

function playBump() {
  if (!actx) return;
  const now = actx.currentTime;
  // Low thud — descending sawtooth
  const osc = actx.createOscillator();
  const og  = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(115, now);
  osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);
  og.gain.setValueAtTime(0.60, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
  osc.connect(og); og.connect(actx.destination);
  osc.start(now); osc.stop(now + 0.16);
  // Noise transient
  const blen = actx.sampleRate * 0.10 | 0;
  const buf  = actx.createBuffer(1, blen, actx.sampleRate);
  const d    = buf.getChannelData(0);
  for (let i = 0; i < blen; i++) d[i] = (Math.random()*2-1) * (1 - i/blen);
  const ns = actx.createBufferSource();
  const ng = actx.createGain();
  ns.buffer = buf;
  ng.gain.setValueAtTime(0.32, now);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
  ns.connect(ng); ng.connect(actx.destination); ns.start(now);
}

function playManholeBlast() {
  if (!actx) return;
  const now = actx.currentTime;
  // Steam hiss — bandpass noise burst
  const hlen = actx.sampleRate * 0.65 | 0;
  const hbuf = actx.createBuffer(1, hlen, actx.sampleRate);
  const hd   = hbuf.getChannelData(0);
  for (let i = 0; i < hlen; i++) hd[i] = Math.random() * 2 - 1;
  const hiss = actx.createBufferSource();
  const bpf  = actx.createBiquadFilter();
  bpf.type = 'bandpass'; bpf.frequency.value = 2800; bpf.Q.value = 0.7;
  const hg = actx.createGain();
  hg.gain.setValueAtTime(0.60, now);
  hg.gain.exponentialRampToValueAtTime(0.001, now + 0.60);
  hiss.buffer = hbuf;
  hiss.connect(bpf); bpf.connect(hg); hg.connect(actx.destination);
  hiss.start(now);
  // Impact thud
  const osc = actx.createOscillator();
  const og  = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(90, now);
  osc.frequency.exponentialRampToValueAtTime(22, now + 0.24);
  og.gain.setValueAtTime(0.80, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
  osc.connect(og); og.connect(actx.destination);
  osc.start(now); osc.stop(now + 0.28);
  // Metal clang — higher pitched
  const osc2 = actx.createOscillator();
  const og2  = actx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(620, now + 0.02);
  osc2.frequency.exponentialRampToValueAtTime(180, now + 0.30);
  og2.gain.setValueAtTime(0.28, now + 0.02);
  og2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  osc2.connect(og2); og2.connect(actx.destination);
  osc2.start(now + 0.02); osc2.stop(now + 0.35);
}

function playDryFire() {
  if (!actx) return;

  const buf  = actx.createBuffer(1, blen, actx.sampleRate);

function playGunshot() {

function playExplosionAt(x, z) {
  if (!actx) return;
  const now = actx.currentTime;
  const pan = actx.createPanner();
  pan.panningModel  = 'HRTF';
  pan.distanceModel = 'inverse';
  pan.refDistance   = 8;
  pan.maxDistance   = 120;
  pan.rolloffFactor = 1.4;
  if (pan.positionX !== undefined) {
    pan.positionX.value = x; pan.positionY.value = 0.5; pan.positionZ.value = z;
  } else {
    pan.setPosition(x, 0.5, z);
  }
  pan.connect(actx.destination);
  // Deep boom — descending sine
  const osc = actx.createOscillator();
  const og  = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(18, now + 0.55);
  og.gain.setValueAtTime(1.1, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.60);
  osc.connect(og); og.connect(pan);
  osc.start(now); osc.stop(now + 0.60);
  // Noise blast
  const blen = actx.sampleRate * 0.22 | 0;
  const buf  = actx.createBuffer(1, blen, actx.sampleRate);
  const d    = buf.getChannelData(0);
  for (let i = 0; i < blen; i++) d[i] = (Math.random()*2-1) * (1 - i/blen) * 0.9;
  const ns  = actx.createBufferSource();
  const lpf = actx.createBiquadFilter();
  lpf.type = 'lowpass'; lpf.frequency.value = 1400;
  const ng  = actx.createGain();
  ng.gain.setValueAtTime(0.65, now);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
  ns.buffer = buf;
  ns.connect(lpf); lpf.connect(ng); ng.connect(pan);
  ns.start(now);
}

// ── Gauge canvas ───────────────────────────────────────
function drawGauges() {
  const gc = gaugesCtx;
  gc.clearRect(0, 0, 220, 130);
  gc.fillStyle = 'rgba(0,0,0,0.52)';
  gc.beginPath(); gc.roundRect(0, 0, 220, 130, 8); gc.fill();

  const drawArc = (cx, cy, r, val, col) => {
    const s = Math.PI * 0.75, sw = Math.PI * 1.5;
    gc.lineCap = 'round'; gc.lineWidth = 7;
    gc.beginPath(); gc.arc(cx, cy, r, s, s + sw);
    gc.strokeStyle = 'rgba(255,255,255,0.12)'; gc.stroke();
    if (val > 0.005) {
      gc.beginPath(); gc.arc(cx, cy, r, s, s + sw * Math.min(val, 1));
      gc.strokeStyle = col; gc.stroke();
    }
  };

  const speedNorm = player.speed / player.topSpeed;
  const rpmNorm   = player._rpmNorm ?? 0;
  const gear      = player._gear    ?? 1;
  drawArc(58,  100, 44, speedNorm, '#44aaff');
  drawArc(162, 100, 44, rpmNorm,   rpmNorm > 0.8 ? '#ff4422' : '#ff9900');

  gc.textAlign = 'center';
  gc.fillStyle = 'rgba(255,255,255,0.45)';
  gc.font = '10px Courier New';
  gc.fillText('SPD', 58, 48);
  gc.fillText('RPM', 162, 48);

  gc.fillStyle = '#fff';
  gc.font = 'bold 20px Courier New';
  gc.fillText('G' + gear, 110, 70);

  // Drift charge bar
  const bx = 10, by = 119, bw = 200, bh = 5;
  gc.fillStyle = 'rgba(255,255,255,0.10)';
  gc.beginPath(); gc.roundRect(bx, by, bw, bh, 3); gc.fill();
  if (player.driftCharge > 0.01) {
    gc.fillStyle = player.driftCharge > 0.7 ? '#ffcc00' : '#00ffcc';
    gc.beginPath(); gc.roundRect(bx, by, bw * player.driftCharge, bh, 3); gc.fill();
  }
}
