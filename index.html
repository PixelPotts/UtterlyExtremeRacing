const optionsPanel = document.getElementById('options-panel');

function _buildOptionsPanel() {
  optionsPanel.innerHTML = '';
  const back = document.createElement('div');
  back.className = 'opt-back';
  back.textContent = '← BACK';
  back.onclick = _optionsBack;
  optionsPanel.appendChild(back);
  for (const def of PARAM_DEFS) {
    if (def.section) {
      const h = document.createElement('div');
      h.className = 'opt-section';
      h.textContent = def.section;
      optionsPanel.appendChild(h);
      continue;
    }
    const row = document.createElement('div');
    row.className = 'opt-row';
    const lbl = document.createElement('label');
    lbl.textContent = def.label;
    const inp = document.createElement('input');
    if (def.type === 'bool') {
      inp.type = 'checkbox';
      inp.checked = !!PARAMS[def.key];
      inp.style.cssText = 'width:18px;height:18px;cursor:pointer;accent-color:#0ff';
      inp.addEventListener('change', () => { PARAMS[def.key] = inp.checked; });
    } else {
      inp.type = 'number';
      inp.min = def.min; inp.max = def.max; inp.step = def.step;
      inp.value = PARAMS[def.key];
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value);
        if (!isNaN(v)) PARAMS[def.key] = v;
      });
    }
    row.appendChild(lbl); row.appendChild(inp);
    optionsPanel.appendChild(row);
  }
}

function _optionsBack() {
  optionsPanel.style.display = 'none';
  document.getElementById('esc-inner').style.display = '';
}

function escActivate(action) {
  if (action === 'restart') location.reload();
  if (action === 'options') {
    _buildOptionsPanel();
    document.getElementById('esc-inner').style.display = 'none';
    optionsPanel.style.display = 'block';
  }
}
function escOpen() {
  escMenu.classList.add('open');
  Object.keys(keys).forEach(k => keys[k] = false);
  _optionsBack(); // ensure main menu visible
  escSelect(0);
}
function escClose() {
  escMenu.classList.remove('open');
  _optionsBack();
}

escItems.forEach((el, i) => {
  el.addEventListener('mouseenter', () => escSelect(i));
  el.addEventListener('click', () => escActivate(el.dataset.action));
});

window.addEventListener('keydown', e => {
  if (escMenu.classList.contains('open')) {
    if (e.code === 'Escape') { escClose(); e.preventDefault(); return; }
    if (e.code === 'ArrowUp')   { escSelect((escSel - 1 + escItems.length) % escItems.length); e.preventDefault(); return; }
    if (e.code === 'ArrowDown') { escSelect((escSel + 1) % escItems.length); e.preventDefault(); return; }
    if (e.code === 'Enter') { escActivate(escItems[escSel].dataset.action); return; }
    return;
  }
  if (e.code === 'Digit1') { location.reload(); return; }
  if (e.code === 'Digit2') { if (currentLevel !== 2) { teardownL1(); startLevel2(); } return; }
  if (e.code === 'Escape') { escOpen(); e.preventDefault(); return; }
  if (e.code === 'KeyR') { toggleWalkMode(); return; }
  if (e.code === 'KeyW') keys.w = true;
  if (e.code === 'KeyS') keys.s = true;
  if (e.code === 'KeyA') keys.a = true;
  if (e.code === 'KeyD') keys.d = true;
  if (e.code === 'KeyF') {
    if (walkMode && !inBuilding) { tryEnterBuilding(); return; }
    keys.f = true;
  }
  if (e.code === 'KeyG') {
    if (!walkMode && playerGrenades > 0 && _grCooldown <= 0) {
      playerGrenades--;
      _grCooldown = 0.8;
      _throwPlayerGrenade();
      _updatePickupHUD();
    }
    return;
  }
  if (e.code === 'Space') { keys.space = true; e.preventDefault(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { keys.shift = true; e.preventDefault(); }
});

function spawnHitText(pts = 10) {

  el.textContent = '+' + pts;
  const deg = (Math.random() - 0.5) * 60;          // ±30° from upright
  const lx  = 8  + Math.random() * 78;              // 8–86 vw

  el.style.cssText = [
    'position:fixed',
    `left:${lx}vw`,
    `top:${ty}vh`,
    `transform:rotate(${deg}deg)`,
    'color:#00ff44',
    'font:bold 52px "Courier New",monospace',
    'text-shadow:0 0 18px #00ff44,0 0 36px #00cc33',
    'pointer-events:none',
    'z-index:9000',
    'user-select:none',
  ].join(';');
  document.body.appendChild(el);
  let tick = 0;
  const iv = setInterval(() => {
    el.style.opacity = tick % 2 === 0 ? '0' : '1';
    if (++tick >= 7) {
      clearInterval(iv);
      el.style.transition = 'opacity 0.35s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 380);
    }
  }, 75);
}

let actx = null;

// ── Ether zone audio (synthesised — no files) ──────────────────────────────
let _etherStaticSrc  = null;
let _etherStaticGain = null;

function _startEtherStatic() {
  if (!actx || _etherStaticSrc) return;
  const sr  = actx.sampleRate;
  const buf = actx.createBuffer(1, sr * 2, sr);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  _etherStaticSrc  = actx.createBufferSource();
  _etherStaticGain = actx.createGain();
  _etherStaticSrc.buffer = buf;
  _etherStaticSrc.loop   = true;
  _etherStaticGain.gain.value = 0.28;
  _etherStaticSrc.connect(_etherStaticGain).connect(actx.destination);
  _etherStaticSrc.start();
}

function _stopEtherStatic() {
  if (!_etherStaticSrc) return;
  if (actx) _etherStaticGain.gain.setTargetAtTime(0, actx.currentTime, 0.08);
  const s = _etherStaticSrc;
  setTimeout(() => { try { s.stop(); } catch(e) {} }, 300);
  _etherStaticSrc = null; _etherStaticGain = null;
}

function _playZzap() {
  if (!actx) return;
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(900, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(55, actx.currentTime + 0.45);
  gain.gain.setValueAtTime(0.55, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.55);
  osc.connect(gain).connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime + 0.60);
}

async function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const load = url => new Promise((res, rej) => {
    if (_audioPre[url]) { actx.decodeAudioData(_audioPre[url].slice(0), res, rej); return; }
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url); xhr.responseType = 'arraybuffer';
    xhr.onload  = () => actx.decodeAudioData(xhr.response, res, rej);
    xhr.onerror = rej;
    xhr.send();
  });
  try {
    [aBufs.engLo, aBufs.engHi, aBufs.thunder, aBufs.squeal] = await Promise.all([
      load('assets/sfx/engine_lo.ogg'),
      load('assets/sfx/engine_hi.ogg'),
      load('assets/sfx/thunder.ogg'),
      load('assets/sfx/tire_squeal.ogg'),
    ]);
  } catch(e) { console.error('Audio load failed:', e); return; }

  // Vehicles handle their own audio subgraphs
  player.initAudio(actx, aBufs);
  aiCars.forEach(ai => ai.initAudio(actx, aBufs));
  if (boxTruck) boxTruck.initAudio(actx, aBufs);
  if (killBot)  killBot.initAudio(actx, aBufs);

  // Tire squeal — volume driven by player drift intensity in frame loop
  if (aBufs.squeal && !_squealSrc) {
    _squealSrc = actx.createBufferSource();
    _squealSrc.buffer = aBufs.squeal;
    _squealSrc.loop   = true;
    _squealGain = actx.createGain();
    _squealGain.gain.value = 0;
    _squealSrc.connect(_squealGain);
    _squealGain.connect(actx.destination);
    _squealSrc.start();
  }
}

function doLightningStrike() {
  const FLASH = 0xBBCCDD;
  const flashes = 1 + (Math.random() < 0.4 ? 1 : 0);
  let s = 0;
  (function tick() {
    const on = s % 2 === 0;
    const NORM = sky.normalBg;
    scene.background.setHex(on ? FLASH : NORM);
    scene.fog.color.setHex(on ? FLASH : NORM);
    s++;
    if (s < flashes * 2) { setTimeout(tick, on ? 65 : 105); }
    else {
      sky.restore();
      setTimeout(() => {
        if (!actx || !aBufs.thunder) return;
        const src = actx.createBufferSource();
        src.buffer = aBufs.thunder;
        const g = actx.createGain(); g.gain.value = 0.85;
        src.connect(g); g.connect(actx.destination); src.start();
      }, 500 + Math.random() * 1800);
    }
  })();
  thunderTimer = 18 + Math.random() * 30;
}

function playBump() {
  if (!actx) return;
  const now = actx.currentTime;
  // Low thud — descending sawtooth
  const osc = actx.createOscillator();
  const og  = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(115, now);
  osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);
  og.gain.setValueAtTime(0.60, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
  osc.connect(og); og.connect(actx.destination);
  osc.start(now); osc.stop(now + 0.16);
  // Noise transient
  const blen = actx.sampleRate * 0.10 | 0;
  const buf  = actx.createBuffer(1, blen, actx.sampleRate);
  const d    = buf.getChannelData(0);
  for (let i = 0; i < blen; i++) d[i] = (Math.random()*2-1) * (1 - i/blen);
  const ns = actx.createBufferSource();
  const ng = actx.createGain();
  ns.buffer = buf;
  ng.gain.setValueAtTime(0.32, now);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
  ns.connect(ng); ng.connect(actx.destination); ns.start(now);
}

function playManholeBlast() {
  if (!actx) return;
  const now = actx.currentTime;
  // Steam hiss — bandpass noise burst
  const hlen = actx.sampleRate * 0.65 | 0;
  const hbuf = actx.createBuffer(1, hlen, actx.sampleRate);
  const hd   = hbuf.getChannelData(0);
  for (let i = 0; i < hlen; i++) hd[i] = Math.random() * 2 - 1;
  const hiss = actx.createBufferSource();
  const bpf  = actx.createBiquadFilter();
  bpf.type = 'bandpass'; bpf.frequency.value = 2800; bpf.Q.value = 0.7;
  const hg = actx.createGain();
  hg.gain.setValueAtTime(0.60, now);
  hg.gain.exponentialRampToValueAtTime(0.001, now + 0.60);
  hiss.buffer = hbuf;
  hiss.connect(bpf); bpf.connect(hg); hg.connect(actx.destination);
  hiss.start(now);
  // Impact thud
  const osc = actx.createOscillator();
  const og  = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(90, now);
  osc.frequency.exponentialRampToValueAtTime(22, now + 0.24);
  og.gain.setValueAtTime(0.80, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
  osc.connect(og); og.connect(actx.destination);
  osc.start(now); osc.stop(now + 0.28);
  // Metal clang — higher pitched
  const osc2 = actx.createOscillator();
  const og2  = actx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(620, now + 0.02);
  osc2.frequency.exponentialRampToValueAtTime(180, now + 0.30);
  og2.gain.setValueAtTime(0.28, now + 0.02);
  og2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  osc2.connect(og2); og2.connect(actx.destination);
  osc2.start(now + 0.02); osc2.stop(now + 0.35);
}

function playExplosionAt(x, z) {
  if (!actx) return;
  const now = actx.currentTime;
  const pan = actx.createPanner();
  pan.panningModel  = 'HRTF';
  pan.distanceModel = 'inverse';
  pan.refDistance   = 8;
  pan.maxDistance   = 120;
  pan.rolloffFactor = 1.4;
  if (pan.positionX !== undefined) {
    pan.positionX.value = x; pan.positionY.value = 0.5; pan.positionZ.value = z;
  } else {
    pan.setPosition(x, 0.5, z);
  }
  pan.connect(actx.destination);
  // Deep boom — descending sine
  const osc = actx.createOscillator();
  const og  = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(18, now + 0.55);
  og.gain.setValueAtTime(1.1, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.60);
  osc.connect(og); og.connect(pan);
  osc.start(now); osc.stop(now + 0.60);
  // Noise blast
  const blen = actx.sampleRate * 0.22 | 0;
  const buf  = actx.createBuffer(1, blen, actx.sampleRate);
  const d    = buf.getChannelData(0);
  for (let i = 0; i < blen; i++) d[i] = (Math.random()*2-1) * (1 - i/blen) * 0.9;
  const ns  = actx.createBufferSource();
  const lpf = actx.createBiquadFilter();
  lpf.type = 'lowpass'; lpf.frequency.value = 1400;
  const ng  = actx.createGain();
  ng.gain.setValueAtTime(0.65, now);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
  ns.buffer = buf;
  ns.connect(lpf); lpf.connect(ng); ng.connect(pan);
  ns.start(now);
}

// ── Gauge canvas ───────────────────────────────────────
function drawGauges() {
  const gc = gaugesCtx;
  gc.clearRect(0, 0, 220, 130);
  gc.fillStyle = 'rgba(0,0,0,0.52)';
  gc.beginPath(); gc.roundRect(0, 0, 220, 130, 8); gc.fill();

  const drawArc = (cx, cy, r, val, col) => {
    const s = Math.PI * 0.75, sw = Math.PI * 1.5;
    gc.lineCap = 'round'; gc.lineWidth = 7;
    gc.beginPath(); gc.arc(cx, cy, r, s, s + sw);
    gc.strokeStyle = 'rgba(255,255,255,0.12)'; gc.stroke();
    if (val > 0.005) {
      gc.beginPath(); gc.arc(cx, cy, r, s, s + sw * Math.min(val, 1));
      gc.strokeStyle = col; gc.stroke();
    }
  };

  const speedNorm = player.speed / player.topSpeed;
  const rpmNorm   = player._rpmNorm ?? 0;
  const gear      = player._gear    ?? 1;
  drawArc(58,  100, 44, speedNorm, '#44aaff');
  drawArc(162, 100, 44, rpmNorm,   rpmNorm > 0.8 ? '#ff4422' : '#ff9900');

  gc.textAlign = 'center';
  gc.fillStyle = 'rgba(255,255,255,0.45)';
  gc.font = '10px Courier New';
  gc.fillText('SPD', 58, 48);
  gc.fillText('RPM', 162, 48);

  gc.fillStyle = '#fff';
  gc.font = 'bold 20px Courier New';
  gc.fillText('G' + gear, 110, 70);

  // Drift charge bar
  const bx = 10, by = 119, bw = 200, bh = 5;
  gc.fillStyle = 'rgba(255,255,255,0.10)';
  gc.beginPath(); gc.roundRect(bx, by, bw, bh, 3); gc.fill();
  if (player.driftCharge > 0.01) {
    gc.fillStyle = player.driftCharge > 0.7 ? '#ffcc00' : '#00ffcc';
    gc.beginPath(); gc.roundRect(bx, by, bw * player.driftCharge, bh, 3); gc.fill();
  }
}

    _posHudEl.style.display = '';

}

// ── Intent detection — builds interior lazily when walker approaches ─────────
// Called every frame (throttled internally via the _intentFrameSkip counter).
let _intentFrameSkip = 0;
const _INTENT_R2 = 8.0 * 8.0;
const _dotGeo    = new THREE.SphereGeometry(0.18, 8, 5);
const _dotMat    = new THREE.MeshBasicMaterial({ color: 0x00FF44 });

function checkBuildingIntent() {
  if (++_intentFrameSkip < 6) return;   // check every 6 frames ≈ 10 Hz at 60fps
  _intentFrameSkip = 0;
  for (const b of _enterableBuildings) {
    if (b.interior) continue;            // already triggered
    const cos  = Math.cos(b.ry), sin = Math.sin(b.ry);
    const dlx  = -b.side * b.hw;
    const dX   = b.x + dlx * cos;
    const dZ   = b.z - dlx * sin;
    const dx = walker.x - dX, dz = walker.z - dZ;
    if (dx * dx + dz * dz < _INTENT_R2) {
      _triggerIntent(b, dX, dZ);
      break;                             // one per check cycle
    }
  }
}

function _triggerIntent(b, doorX, doorZ) {
  // Build interior geometry — attaches to building group (rotates/positions with it)
  b.interior = new BuildingInterior(b.def, b.side);
  b.interior.build(b.group);

  // Debug dot — small green sphere above the door in world space, never culled
  const dot  = new THREE.Mesh(_dotGeo, _dotMat);
  dot.position.set(doorX, b.groundY + 2.9, doorZ);
  dot.frustumCulled = false;
  scene.add(dot);
  b.intentDot = dot;

  // Green screen flash
  const el = document.getElementById('intent-flash');
  if (el) {
    el.style.transition = 'none';
    el.style.opacity    = '1';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity 0.45s ease-out';
      el.style.opacity    = '0';
    });
  }
}

function tryEnterBuilding() {
  const REACH = 3.0;
  for (const b of _enterableBuildings) {
    // Door face world position: local X = (-side * hw), local Z = 0
    const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
    const dlx = -b.side * b.hw;
    const doorX = b.x + dlx * cos;
    const doorZ = b.z - dlx * sin;
    const dx = walker.x - doorX, dz = walker.z - doorZ;
    if (dx * dx + dz * dz < REACH * REACH) { enterBuilding(b); return; }
  }
}

function _logBuildingEntry(b) {
  const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
  const dx = walker.x - b.x, dz = walker.z - b.z;
  const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
  const localWalkerY = walker.y - (b.groundY + b.h * 0.5);
  const interior = b.interior;
  const data = {
    def: b.def,
    world: { x: b.x, z: b.z, ry: b.ry, groundY: b.groundY, side: b.side },
    interior: interior ? {
      nFloors:     interior.nFloors,
      floorH:      interior.floorH,
      stairXStart: interior.stairXStart,
      stairXEnd:   interior.stairXEnd,
      stairZL:     interior.stairZL,
      stairZR:     interior.stairZR,
      staircases:  interior.staircases.length,
    } : null,
    walkerEntry: { wx: walker.x, wz: walker.z, wy: walker.y, lx, lz, localWalkerY },
    groupChildren: b.group.children.map(c => c.type + (c.isLight ? `(${c.intensity})` : '')),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'building_entry_debug.json';
  a.click();
}

// ── Mission result handler ──────────────────────────────────────────────────
// Called by enterBuilding (objective) and notifyEvent; result may be null.
function _handleMissionResult(result) {
  if (!result) return;
  const p = result.debrief?.length ? DialogSystem.show(result.debrief) : Promise.resolve();
  if (result.isLevelComplete)
    p.then(() => setTimeout(() => { if (currentLevel === 1) { teardownL1(); startLevel2(); } }, 1500));
}

function _updateMissionHUD() {
  const name  = MissionSystem.activeMissionName();
  const obj   = MissionSystem.activeObjectiveText();
  const timer = MissionSystem.activeTimerText();
  const el    = document.getElementById('mission-hud');
  el.style.display = name ? 'block' : 'none';
  document.getElementById('mission-name').textContent  = name  ?? '';
  document.getElementById('mission-obj').textContent   = obj   ?? '';
  document.getElementById('mission-timer').textContent = timer ?? '';
}

function enterBuilding(b) {
  inBuilding   = true;
  _currentBldg = b;

  // Ensure interior exists (may not if player warped in without passing intent radius)
  if (!b.interior) {
    const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
    const dlx = -b.side * b.hw;
    _triggerIntent(b, b.x + dlx * cos, b.z - dlx * sin);
  }

  // Place walker 0.5m inside the door face
  const fy  = b.groundY;
  const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
  const dlx = -b.side * (b.hw - 0.5);
  walker.x  = b.x + dlx * cos;
  walker.z  = b.z - dlx * sin;
  walker.y  = fy;
  walker.vy = 0;

  _logBuildingEntry(b);

  const _mRole = b.group.userData.missionRole;
  const _mKey  = b.group.userData._missionSpawnKey;
  if (_mRole === 'giver') {
    const result = MissionSystem.acceptMission(b.group.userData.missionId);
    if (result) {
      Minimap.removeMarker(_mKey);
      const mk = _missionMarkers.get(_mKey);
      if (mk) { mk.dispose(); _missionMarkers.delete(_mKey); }
      // Re-scan already-generated zones from decoFrontier forward.
      // onZoneStart may have fired before accept (AHEA=30, ZONE_MIN_SEGS=30),
      // so objective spawns need to be queued retroactively.
      let _rz = null;
      for (let _rs = decoFrontier; _rs < zoneTypes.length; _rs++) {
        if (zoneTypes[_rs] !== _rz) { _rz = zoneTypes[_rs]; MissionSystem.onZoneStart(_rz, _rs); }
      }
      if (result.briefing?.length) DialogSystem.show(result.briefing);
    }
  } else if (_mRole === 'objective') {
    const result = MissionSystem.completeObjective(b.group.userData.missionId, b.group.userData.missionObjId);
    Minimap.removeMarker(_mKey);
    const mk = _missionMarkers.get(_mKey);
    if (mk) { mk.dispose(); _missionMarkers.delete(_mKey); }
    _handleMissionResult(result);
  }
}

function exitBuilding() {
  inBuilding   = false;
  for (const m of _interiorMeshes) scene.remove(m);
  _interiorMeshes = [];
  // Step walker outside the door so they don't immediately re-enter
  if (_currentBldg) {
    const b   = _currentBldg;
    const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
    const dlx = -b.side * b.hw;
    walker.x = b.x + (dlx + b.side * -1.5) * cos;
    walker.z = b.z + (dlx + b.side * -1.5) * (-sin);
  }
  _currentBldg = null;
}

// ── Game Loop ──────────────────────────────────────────
function frame() {
  _rafId = requestAnimationFrame(frame);
  const _ft0 = performance.now();
  const dt = Math.min(clock.getDelta(), .05);

  if (raceStarted && speedMul > 1) speedMul = Math.max(1, speedMul - dt / BOOST_DUR);
  let nitroBoost = 1.0;
  if (keys.shift && player.driftCharge > 0.1) {
    nitroBoost = 1.0 + player.driftCharge * 2.0;
    player.driftCharge = Math.max(0, player.driftCharge - dt * 1.5);
  } else if (keys.shift && nitroCharges > 0 && _nitroBurnTimer <= 0) {
    nitroCharges--;
    _nitroBurnTimer = 3.0;
    _updatePickupHUD();
  }
  if (_nitroBurnTimer > 0) {
    _nitroBurnTimer = Math.max(0, _nitroBurnTimer - dt);
    nitroBoost = Math.max(nitroBoost, 1.8);
  }
  const effectiveMul = speedMul * nitroBoost;
  const playerSY = getFloorY(player.x, player.z, player.seg);

  // Respawn after 2.5 s of no road surface under player
  if (raceStarted && PARAMS.respawn) {
    if (playerSY === -Infinity) {
      _fallTimer += dt;
      if (_fallTimer >= 2.5) {
        const rp = path[player.seg]?.pos;
        if (rp) {
          player.x = rp.x; player.z = rp.z;
          player.group.position.set(rp.x, rp.y + 1.5, rp.z);
          player.vy = 0; player.lateralVel = 0;
        }
        _fallTimer = 0;
      }
    } else {
      _fallTimer = 0;
    }
  }

  const playerSurface = (zoneTypes[player.seg] === 'dirt') ? 'dirt' : 'asphalt';
  const advanced = walkMode ? 0 : player.update(dt, (raceStarted && !DialogSystem.isActive()) ? keys : {}, effectiveMul, playerSY, playerSurface);

  // Walker update (walk mode)
  if (walkMode && walker) {
    // Intent check — build interior on approach (throttled to ~10 Hz)
    if (!inBuilding) checkBuildingIntent();

    // Floor Y — use interior procedural floor when inside a building with one,
    // otherwise fall back to road-quad raycasting.
    let wFloorY;
    if (inBuilding && _currentBldg?.interior) {
      const b   = _currentBldg;
      const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
      const dx  = walker.x - b.x, dz = walker.z - b.z;
      const lx  = dx * cos - dz * sin;     // world → local X
      const lz  = dx * sin + dz * cos;     // world → local Z
      // Walker local Y relative to building group center
      const localWalkerY = walker.y - (b.groundY + b.h * 0.5);
      const localFloorY  = b.interior.getLocalFloorY(lx, lz, localWalkerY);
      wFloorY = b.groundY + b.h * 0.5 + localFloorY;
    } else {
      wFloorY = getFloorY(walker.x, walker.z, walker.seg);
    }
    walker.update(dt, DialogSystem.isActive() ? {} : keys, wFloorY);
    if (inBuilding && _currentBldg?.shopNpc) _currentBldg.shopNpc.update(dt);
    // Advance walker.seg along path
    for (let s = walker.seg - 1; s <= walker.seg + 2; s++) {
      if (!path[s] || !path[s + 1]) continue;
      const pp = path[s].pos, pn = path[s + 1].pos;
      const fx = pn.x - pp.x, fz = pn.z - pp.z;
      const dx = walker.x - pp.x, dz = walker.z - pp.z;
      const t  = (dx * fx + dz * fz) / (fx * fx + fz * fz + 1e-9);
      if (t >= 0 && t < 1) { walker.seg = s; break; }
    }
  }

  // Landing thud — works during countdown too
  if (!walkMode && player._justLanded) {
    camBumpVel += Math.min(player._landSpeed * 0.06, 1.4);
    if (player._landSpeed > 5) playBump();
  }

  if (raceStarted) {
    if (advanced) {
      while (path.length - 1 - player.seg < AHEA + 10) {
        genPt();
        buildSeg(path.length - 2);
      }
      while (decoFrontier <= player.seg + DECO_AHEAD && path[decoFrontier + 1]) {
        const si = decoFrontier++;
        _decoQueue.push(() => addDecorations(si));
      }
      while (pickupFrontier <= player.seg + DECO_AHEAD && path[pickupFrontier + 1]) {
        pickupManager.spawnForSeg(pickupFrontier, gunPickedUp);
        pickupFrontier++;
      }
      pickupManager.dropSeg(player.seg - KEEP);
      dropSeg(player.seg - KEEP);
      dropDecorations(player.seg - KEEP);
    }

    // Tree collision — crushable (small) trees flatten; solid big trees stop the car
    {
      const VHW = 1.15; // vehicle half-width
      for (let si = player.seg - 1; si <= player.seg + 3; si++) {
        const decor = decorSeg[si];
        if (!decor) continue;
        for (const obj of decor) {
          if (!obj.userData.isTree || obj.userData.crushed) continue;
          const dx = obj.position.x - player.x;
          const dz = obj.position.z - player.z;
          if (dx*dx + dz*dz < (obj.userData.hitRadius + VHW) ** 2) {
            if (obj.userData.crushable) {
              obj.userData.crushed     = true;
              obj.userData.crushTime   = 0;
              obj.userData.crushAngle  = Math.atan2(dx, dz);
              crushingTrees.push(obj);
              player.speed *= 0.88;
            } else {
              player.speed = Math.max(0, player.speed * 0.06);
              camBumpVel  += 2.2;
            }
          }
        }
      }
      // Animate falling/crushing trees
      for (let i = crushingTrees.length - 1; i >= 0; i--) {
        const t = crushingTrees[i];
        t.userData.crushTime += dt;
        const p = Math.min(t.userData.crushTime / 0.35, 1);
        t.rotation.x = Math.sin(t.userData.crushAngle) * p * Math.PI * 0.5;
        t.rotation.z = Math.cos(t.userData.crushAngle) * p * Math.PI * 0.5;
        if (p >= 1) { scene.remove(t); crushingTrees.splice(i, 1); }
      }
    }

    // Light pole collision — solid stop, pole tips over
    {
      const VHW = 1.15;
      for (let si = player.seg - 1; si <= player.seg + 3; si++) {
        const decor = decorSeg[si];
        if (!decor) continue;
        for (const obj of decor) {
          if (!obj.userData.isPole || obj.userData.crushed) continue;
          const dx = obj.position.x - player.x;
          const dz = obj.position.z - player.z;
          if (dx*dx + dz*dz < (obj.userData.hitRadius + VHW) ** 2) {
            obj.userData.crushed    = true;
            obj.userData.poleDown   = true;
            obj.userData.crushTime  = 0;
            obj.userData.crushAngle = Math.atan2(dx, dz);
            crushingPoles.push(obj);
            player.speed = Math.max(0, player.speed * 0.06);
            camBumpVel  += 2.2;
          }
        }
      }
      for (let i = crushingPoles.length - 1; i >= 0; i--) {
        const p = crushingPoles[i];
        if (!p.parent) { crushingPoles.splice(i, 1); continue; }
        p.userData.crushTime += dt;
        const prog = Math.min(p.userData.crushTime / 0.5, 1);
        p.rotation.x = Math.sin(p.userData.crushAngle) * prog * Math.PI * 0.5;
        p.rotation.z = Math.cos(p.userData.crushAngle) * prog * Math.PI * 0.5;
        if (prog >= 1) crushingPoles.splice(i, 1);
      }
    }

    // Building wall collision — OBB vs player circle
    {
      const VHW = 1.15;
      for (let si = player.seg - 2; si <= player.seg + 4; si++) {
        const boxes = _wallBoxes.get(si);
        if (!boxes) continue;
        for (const b of boxes) {
          const dx = player.x - b.x, dz = player.z - b.z;
          const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
          const lx = dx * cos - dz * sin;
          const lz = dx * sin + dz * cos;
          const cx = Math.max(-b.hw, Math.min(b.hw, lx));
          const cz = Math.max(-b.hd, Math.min(b.hd, lz));
          const ex = lx - cx, ez = lz - cz;
          const dist2 = ex*ex + ez*ez;
          if (dist2 > 0 && dist2 < VHW * VHW) {
            const dist = Math.sqrt(dist2);
            const pen  = VHW - dist;
            const nx   = ex / dist, nz = ez / dist;
            player.x += (nx * cos + nz * sin) * pen;
            player.z += (-nx * sin + nz * cos) * pen;
            player.speed = Math.max(0, player.speed * 0.08);
            camBumpVel  += 2.0;
          }
        }
      }
    }

    // Pedestrian ragdoll — hit sends them flying based on speed
    {
      for (const obs of obstacles) {
        if (!(obs instanceof PedestrianObstacle) || obs._ragdoll) continue;
        const dx = obs._wx - player.x;
        const dz = obs._wz - player.z;
        if (dx*dx + dz*dz < 1.6 * 1.6) {
          // Launch in player's forward direction at player speed +40%
          obs.ragdoll(player.speed * 1.4, -Math.sin(player.angle), Math.cos(player.angle));
          player.speed *= 0.95;
          spawnHitText(10);
        }
      }
    }

    // Walker collisions (building OBB with door gap + pedestrian nudge + auto-exit)
    if (walkMode && walker) {
      const VHW = 0.35; // walker radius (narrower than car)
      // Building OBB — skip door gap so walker can pass through
      for (let si = walker.seg - 2; si <= walker.seg + 4; si++) {
        const boxes = _wallBoxes.get(si);
        if (!boxes) continue;
        for (const b of boxes) {
          const dx = walker.x - b.x, dz = walker.z - b.z;
          const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
          const lx = dx * cos - dz * sin;
          const lz = dx * sin + dz * cos;
          const cx = Math.max(-b.hw, Math.min(b.hw, lx));
          const cz = Math.max(-b.hd, Math.min(b.hd, lz));
          // Door gap: skip collision on the road-facing face within door width
          if (b.enterable) {
            const doorFX = -b.side * b.hw;
            if (Math.abs(cx - doorFX) < 0.05 && Math.abs(cz) < b.doorHW) continue;
          }
          const ex = lx - cx, ez = lz - cz;
          const dist2 = ex * ex + ez * ez;
          if (dist2 > 0 && dist2 < VHW * VHW) {
            const dist = Math.sqrt(dist2);
            const pen  = VHW - dist;
            const nx = ex / dist, nz = ez / dist;
            walker.x += (nx * cos + nz * sin) * pen;
            walker.z += (-nx * sin + nz * cos) * pen;
          }
        }
      }
      // Interior containment — prevent walking through walls except door gap
      if (inBuilding && _currentBldg) {
        const b = _currentBldg;
        const dx = walker.x - b.x, dz = walker.z - b.z;
        const cos = Math.cos(b.ry), sin = Math.sin(b.ry);
        let lx = dx * cos - dz * sin;
        let lz = dx * sin + dz * cos;
        const doorFX = -b.side * b.hw;
        // Auto-exit: walker walked out through door gap
        if (Math.sign(lx) === Math.sign(doorFX) && Math.abs(lx) > b.hw && Math.abs(lz) < b.doorHW) {
          exitBuilding();
        } else {
          // Clamp to inside — solid walls, except door face gap
          let pushLX = 0, pushLZ = 0;
          if (lx > b.hw - VHW && !(Math.abs(lx - b.hw) < 0.5 && Math.abs(lz) < b.doorHW && b.side === -1))
            pushLX = -(lx - (b.hw - VHW));
          if (lx < -b.hw + VHW && !(Math.abs(lx + b.hw) < 0.5 && Math.abs(lz) < b.doorHW && b.side === 1))
            pushLX = -(lx - (-b.hw + VHW));
          if (lz > b.hd - VHW)  pushLZ = -(lz - (b.hd - VHW));
          if (lz < -b.hd + VHW) pushLZ = -(lz - (-b.hd + VHW));
          if (pushLX || pushLZ) {
            walker.x += pushLX * cos + pushLZ * sin;
            walker.z += -pushLX * sin + pushLZ * cos;
          }
        }
      }
      // Pedestrian bump — gentle push, no ragdoll
      for (const obs of obstacles) {
        if (!(obs instanceof PedestrianObstacle) || obs._ragdoll) continue;
        const dx = obs._wx - walker.x, dz = obs._wz - walker.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < 0.7 * 0.7 && d2 > 0) {
          const d = Math.sqrt(d2);
          walker.x -= (dx / d) * (0.7 - d) * 0.5;
          walker.z -= (dz / d) * (0.7 - d) * 0.5;
        }
      }
    }

    // AI cars — with car-following, lane-change, rubber-band, shooting
    const aiCtx = { others: aiCars, player, allLanes: LANES };
    aiCars.forEach(ai => ai.update(dt, speedMul, getFloorY(ai.x, ai.z, ai.seg), aiCtx));

    // AI bullet hit detection (25% accuracy baked into spread; check here for player impact)
    for (const ai of aiCars) {
      if (!ai.weapon) continue;
      for (const b of ai.weapon.bullets) {
        const dx = b.mesh.position.x - player.x;
        const dy = b.mesh.position.y - (player.group.position.y + 0.6);
        const dz = b.mesh.position.z - player.z;
        if (dx*dx + dy*dy + dz*dz < 1.8 * 1.8) {
          player.speed = Math.max(0, player.speed * 0.72);
          camBumpVel  += 0.9;
          b.life       = -1; // expire bullet
        }
      }
    }

    // TEMP DISABLED: Box truck lifecycle
    // if (_btState === 'idle') { ... new BoxTruck ... }
    // else if (_btState === 'active') { boxTruck.update(...) }
    // else if (_btState === 'fleeing') { boxTruck.update(...); boxTruck.dispose() }

    // Traffic light phase cycling
    intersections.forEach(inter => {
      inter.timer -= dt;
      if (inter.timer <= 0) {
        inter.phase = (inter.phase + 1) % 4;
        inter.timer = PHASE_DUR[inter.phase];
        applyPhase(inter);
      }
    });

    // Kerb bump detection — lateral offset check
    if (player.seg + 1 < path.length) {
      const sa = path[player.seg].angle;
      const spx = Math.cos(sa), spz = Math.sin(sa);
      const rc  = path[player.seg].pos;
      const latOff = (player.x - rc.x) * spx + (player.z - rc.z) * spz;
      const kInner = RW * 0.5 - 0.25, kOuter = RW * 0.5 + 1.1 + 0.45;
      if (Math.abs(latOff) > kInner && Math.abs(latOff) < kOuter) {
        if (player.seg !== lastBumpSeg) {
          lastBumpSeg = player.seg;
          camBumpVel  += 0.55;
          playBump();
        }
      }
    }
    hudEl.textContent = Math.round(SLEN * 134 * player.speed * effectiveMul) + ' MPH';
    // Position: count how many cars are ahead (higher seg = further along)
    const allCars = [player, ...aiCars, ...(boxTruck ? [boxTruck] : [])];
    const ahead = allCars.filter(c => c !== player && c.seg > player.seg).length;
    posNumEl.textContent = ahead + 1;
    posDenEl.textContent = '/' + allCars.length;
  }
  if (!walkMode) drawGauges();
  Minimap.update(path, player.seg, player.x, player.z, player.angle);

  if (player.seg + 1 >= path.length) return;

  const roadY = player._roadY ?? 0;

  if (walkMode && walker) {
    // ── FPS camera (walk mode) ─────────────────────��───
    const eye = walker.eyePos();
    cam.position.set(eye.x, eye.y, eye.z);
    cam.rotation.order = 'YXZ';
    cam.rotation.y = -walker.yaw;
    cam.rotation.x = walker.pitch;
    cam.rotation.z = 0;
  } else {
  // Camera — fixed behind car; SPACE snaps to look-behind
  const camTgtYaw = keys.space ? Math.PI : 0;
  camYaw += (camTgtYaw - camYaw) * 0.15;

  // Bump spring physics
  camBumpVel += (-90 * camBumpPos - 16 * camBumpVel) * dt;
  camBumpPos += camBumpVel * dt;

  const CDIST   = 7;
  const viewAng = player.angle + camYaw;
  const cx = player.x - Math.sin(viewAng) * CDIST;
  const cy = Math.max(roadY + 1.2, roadY + 0.5 + 2.7 + camBumpPos);
  const cz = player.z + Math.cos(viewAng) * CDIST;
  cam.position.set(cx, cy, cz);
  cam.lookAt(player.x, roadY + 0.5 + 0.7, player.z);
  } // end !walkMode camera

  // ── Spatial audio updates ─────────────────────────────
  if (actx) {
    if (raceStarted) {
      player.updateAudio(dt);
      aiCars.forEach(ai => ai.updateAudio(dt));
      if (boxTruck) boxTruck.updateAudio(dt);
      if (_squealGain) {
        const sqVol = player.isDrifting ? Math.min(0.65, Math.abs(player.lateralVel) * 14) : 0;
        _squealGain.gain.setTargetAtTime(sqVol, actx.currentTime, 0.08);
      }
    }
    // Listener = camera position + forward vector
    const L = actx.listener;
    let fdx, fdy, fdz;
    if (walkMode && walker) {
      // FPS: listener faces camera look direction (negate yaw to match cam.rotation.y = -yaw)
      fdx = -Math.cos(walker.pitch) * Math.sin(walker.yaw);
      fdy =  Math.sin(walker.pitch);
      fdz = -Math.cos(walker.pitch) * Math.cos(walker.yaw);
    } else {
      fdx = player.x - cam.position.x; fdy = (roadY+0.5+0.7) - cam.position.y; fdz = player.z - cam.position.z;
    }
    const fdl = Math.sqrt(fdx*fdx + fdy*fdy + fdz*fdz) || 1;
    if (L.positionX !== undefined) {
      L.positionX.value = cam.position.x; L.positionY.value = cam.position.y; L.positionZ.value = cam.position.z;
      L.forwardX.value = fdx/fdl; L.forwardY.value = fdy/fdl; L.forwardZ.value = fdz/fdl;
      L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    } else {
      L.setPosition(cam.position.x, cam.position.y, cam.position.z);
      L.setOrientation(fdx/fdl, fdy/fdl, fdz/fdl, 0, 1, 0);
    }
  }

  thunderTimer -= dt;
  if (thunderTimer <= 0) doLightningStrike();

  // Sky — update biome atmosphere
  sky.setZone(zoneTypes[player.seg] ?? 'trees');
  sky.update(dt);
  for (const m of _missionMarkers.values()) m.update(dt);

  // ── Mission system tick (fail conditions) ────────────────────────────────
  const _mFail = MissionSystem.tick(dt);
  if (_mFail) {
    for (const key of _mFail.staleKeys) {
      Minimap.removeMarker(key);
      const _smk = _missionMarkers.get(key);
      if (_smk) { _smk.dispose(); _missionMarkers.delete(key); }
    }
  }
  _updateMissionHUD();

  // ── Player bullet → AI hit detection ────────────────────────────────────
  if (activeWeapon) {
    outer: for (const b of activeWeapon.bullets) {
      for (const ai of aiCars) {
        const dx = b.mesh.position.x - ai.group.position.x;
        const dy = b.mesh.position.y - ai.group.position.y;
        const dz = b.mesh.position.z - ai.group.position.z;
        if (dx*dx + dy*dy + dz*dz < 2.8 * 2.8) {
          b.life = -1;
          _handleMissionResult(MissionSystem.notifyEvent('enemy_hit'));
          continue outer;
        }
      }
    }
  }

  sun.position.set(player.x+60, 150, player.z+50);
  sun.target.position.set(player.x, roadY + .5, player.z);
  sun.target.updateMatrixWorld();

  // rain
  const rp = rainGeo.attributes.position.array;
  const fall = 38 * dt;
  for (let i = 0; i < RAIN_COUNT; i++) {
    rp[i*6+1] -= fall; rp[i*6+4] -= fall;
    if (rp[i*6+4] < 0) { const ny = 55+Math.random()*5; rp[i*6+1]=ny; rp[i*6+4]=ny-1.4; }
  }
  const _vx = (walkMode && walker) ? walker.x : player.x;
  const _vz = (walkMode && walker) ? walker.z : player.z;
  rainMesh.position.set(_vx, 0, _vz);
  rainGeo.attributes.position.needsUpdate = true;

// ── Level 2 path generator ─────────────────────────────────────────────────────
// Generates hilly, curvy neon road. Uses the same module-level path-state vars
// (pAng, pTgt, pTimer, pCurve, pHeightY, pHeightVel, pTargetY, pPos) that
// teardownL1 already resets to zero before this is called.
// Split-run scheduling state (reset in startLevel2):
let _l2SplitActive = false, _l2SplitStart = 0, _l2SplitLen = 0, _l2SplitGapSegs = 0;
let _l2HillsLeft = 0;

function genPtL2() {
  // ── Normal generation ──────────────────────────────────────────────────────
  if (pTimer > 0) { pTimer--; }
  else {
    if (Math.random() < 0.22) {
      pTgt = pAng * 0.06; pCurve = 0.06;
      pTimer = 10 + (Math.random() * 20 | 0);
    } else {
      pTgt = (Math.random() - 0.5) * Math.PI * 0.55;
      pCurve = 0.07 + Math.random() * 0.09;
      pTimer = 7 + (Math.random() * 15 | 0);
    }
  }
  pAng += (pTgt - pAng) * pCurve;
  pPos.x += Math.sin(pAng) * SLEN;
  pPos.z -= Math.cos(pAng) * SLEN;
  const A = 14, K = 0.036;
  if (Math.abs(pHeightY - pTargetY) < 0.4)
    pTargetY = 12 + Math.random() * A * 2;
  pHeightVel += (pTargetY - pHeightY) * K;
  pHeightVel *= 0.80;
  pHeightY   += pHeightVel;
  pPos.y = pHeightY;
  path.push({ pos: pPos.clone(), angle: pAng });
  let _zType;
  if (_l2SplitActive) {
    _zType = 'splitRoad';
    if (path.length - _l2SplitStart >= _l2SplitLen) {
      _l2SplitActive  = false;
      _l2SplitGapSegs = 23 + (Math.random() * 20 | 0);
    }
  } else if (_l2SplitGapSegs > 0) {
    _l2SplitGapSegs--;
    if (_l2HillsLeft > 0) {
      _l2HillsLeft--;
      _zType = 'hills';
    } else if (path.length % 25 === 0 && path.length > 8) {
      _zType = 'neonRing';
    } else if (_l2SplitGapSegs > 10 && Math.random() < 0.12) {
      _l2HillsLeft = 8 + (Math.random() * 10 | 0);
      _zType = 'hills';
    } else {
      _zType = 'neonRoad';
    }
  } else if (path.length > 20) {
    _l2SplitStart  = path.length - 1;
    _l2SplitLen    = 41 + (Math.random() * 37 | 0);
    _l2SplitActive = true;
    _zType = 'splitRoad';
  } else {
    _zType = 'neonRoad';
  }
  zoneTypes.push(_zType);
}

  // 16 points covers ~DECO_AHEAD÷8 neon cubes + margin.
  _neonLightPool        = new NeonLightPool(scene, 44, 16);
  _splitLightPoolBlue   = new NeonLightPool(scene, 12, 0, 0x0088ff);

  ambLight.color.setHex(0x200050);

  scene.remove(rainMesh);

  const moonHalo = new THREE.Mesh(
    new THREE.SphereGeometry(11, 16, 10),
    new THREE.MeshBasicMaterial({ color: 0x99AABB, transparent: true, opacity: 0.12, side: THREE.BackSide })
  );
  moonMesh.add(moonHalo);
  scene.add(moonMesh);
  // Soft moonlight
  const moonLight = new THREE.PointLight(0xAABBCC, 60, 600);
  moonMesh.add(moonLight);

  // Stars
  {
    const N = 1400;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi   = Math.random() * Math.PI * 0.52;   // upper hemisphere + a bit past horizon
      const r     = 440;
      pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.cos(phi);
      pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    starsMesh = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, sizeAttenuation: false, fog: false }));
    scene.add(starsMesh);
  }

  initAudio().catch(() => {});

  // Show Level 2 loading screen — preload killbot GLB + compile shaders before starting
  const _l2Screen = document.getElementById('level2-screen');
  const _l2Fill   = document.getElementById('level2-bar-fill');
  _l2Screen.style.opacity = '1';
  _l2Screen.style.display = 'flex';

  // Animate bar from 0 to ~60% while waiting (fallback if no onProgress)
  _l2Fill.style.transition = 'width 1.8s linear';
  requestAnimationFrame(() => { _l2Fill.style.width = '60%'; });

  preloadKillBot1(e => {
    if (e.total) {
      _l2Fill.style.transition = 'width 0.2s linear';
      _l2Fill.style.width = (e.loaded / e.total * 75) + '%';
    }
  }).then(gltf => {
    // Add an invisible clone so compileAsync bakes killbot shaders — prevents mid-game freeze
    const _tmpKb = gltf.scene.clone(true);
    _tmpKb.visible = false;
    scene.add(_tmpKb);
    _l2Fill.style.transition = 'width 0.15s linear';
    _l2Fill.style.width = '80%';
    return renderer.compileAsync(scene, cam).then(() => { scene.remove(_tmpKb); });
  }).then(() => {
    _l2Fill.style.transition = 'width 0.15s linear';
    _l2Fill.style.width = '100%';
    setTimeout(() => {
      _l2Screen.style.opacity = '0';
      setTimeout(() => {
        _l2Screen.style.display = 'none';
        _l2Screen.style.opacity = '1';
        _l2Fill.style.transition = 'none';
        _l2Fill.style.width = '0%';
      }, 520);
    }, 180);
    raceStarted = true; speedMul = 1;
    frameL2();
  });
}

function frameL2() {
  _rafId = requestAnimationFrame(frameL2);
  const _ft0 = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  let nitroBoost = 1.0;
  if (keys.shift && player.driftCharge > 0.1) {
    nitroBoost = 1.0 + player.driftCharge * 2.0;
    player.driftCharge = Math.max(0, player.driftCharge - dt * 1.5);
  } else if (keys.shift && nitroCharges > 0 && _nitroBurnTimer <= 0) {
    nitroCharges--;
    _nitroBurnTimer = 3.0;
    _updatePickupHUD();
  }
  if (_nitroBurnTimer > 0) {
    _nitroBurnTimer = Math.max(0, _nitroBurnTimer - dt);
    nitroBoost = Math.max(nitroBoost, 1.8);
  }
  const effectiveMul = speedMul * nitroBoost;

  const playerSY = getFloorY(player.x, player.z, player.seg);
  const advanced = player.update(dt, keys, effectiveMul, playerSY, 'asphalt');

  if (advanced) {
    while (path.length - 1 - player.seg < AHEA + 10) {
      genPtL2();
      buildSeg(path.length - 2);
    }
    while (decoFrontier <= player.seg + DECO_AHEAD && path[decoFrontier + 1]) {
      const si = decoFrontier++;
      _decoQueue.push(() => addDecorations(si));
    }
    while (pickupFrontier <= player.seg + DECO_AHEAD && path[pickupFrontier + 1]) {
      pickupManager.spawnForSeg(pickupFrontier, gunPickedUp);
      pickupFrontier++;
    }
    pickupManager.dropSeg(player.seg - KEEP);
    dropSeg(player.seg - KEEP);
    dropDecorations(player.seg - KEEP);
  }

  // ── Decoration work queue (L2) ────────────────────────
  { const _fqT0 = performance.now(); _decoQueue.flush(3); const _fqMs = performance.now() - _fqT0;
    if (_fqMs > 3) _DBG.log(`FLUSH_OVER_BUDGET_L2\tms=${_fqMs.toFixed(2)}\tpending=${_decoQueue.pending}\tseg=${player?.seg}\tzone=${zoneTypes[player?.seg]??'?'}`); }

  // Animate black water — scroll the normal-map UV offset
  _waterUniforms.uTime.value += dt;
  const _wt = _waterUniforms.uTime.value;
  _waterNormalMap.offset.set(_wt * 0.007, _wt * 0.005);

  // Moon — fixed sky position relative to camera (sky-billboard style)
  if (moonMesh) {
    moonMesh.position.set(
      cam.position.x - 60,
      cam.position.y + 85,
      cam.position.z - 180
    );
  }

  // Flying cars — wrap each car when it drifts more than 110 m from road center
  for (const fc of flyingCars) {
    fc.update(dt);
    if (Math.abs(fc.group.position.x) > 110) {
      const dir  = -Math.sign(fc._vx);
      const spd  = Math.abs(fc._vx) * dir;
      const zOff = player.z - 15 - Math.random() * 70;
      fc.reset(dir > 0 ? -95 : 95, fc.group.position.y, zOff, spd, fc._vz);
    }
  }

  // KillBot lifecycle
  if (_kbState === 'idle') {
    _kbTimer -= dt;
    if (_kbTimer <= 0) {
      killBot = new KillBot1(scene, path, player.seg + 5, SLEN, { onExplosion: playExplosionAt });
      if (actx) killBot.initAudio(actx, aBufs);
      _kbState = 'active';
      _kbActiveTime = 0;
    }
  } else if (_kbState === 'active') {
    _kbActiveTime += dt;
    killBot.update(dt, player.seg, player.t, player.x, player.z, player.speed, player.angle, speedMul,
      getFloorY(killBot._enemyX, killBot._enemyZ, killBot.seg));
    if (_kbActiveTime > 35) {
      killBot._fleeing = true;
      _kbState = 'fleeing';
    }
  } else if (_kbState === 'fleeing') {
    killBot.update(dt, player.seg, player.t, player.x, player.z, player.speed, player.angle, speedMul,
      getFloorY(killBot._enemyX, killBot._enemyZ, killBot.seg));
    if (killBot.fleeComplete) {
      killBot.dispose();
      killBot = null;
      _kbState = 'idle';
      _kbTimer = 20 + Math.random() * 40;
    }
  }

  // ── Pickups + player grenades (L2) ───────────────────
  pickupManager?.update(dt, player.x, player.z);
  if (_grCooldown > 0) _grCooldown -= dt;
  for (let i = _playerGrenades3D.length - 1; i >= 0; i--) {
    if (!_playerGrenades3D[i].update(dt)) {
      _playerGrenades3D[i].dispose();
      _playerGrenades3D.splice(i, 1);
    }
  }

  if (actx) {
    player.updateAudio(dt);
    if (killBot) killBot.updateAudio(dt);
    if (_squealGain) {
      const sqVol = player.isDrifting ? Math.min(0.65, Math.abs(player.lateralVel) * 14) : 0;
      _squealGain.gain.setTargetAtTime(sqVol, actx.currentTime, 0.08);
    }
  }

  const roadY = player._roadY ?? 0;
  if (walkMode && walker) {
    const eye = walker.eyePos();
    cam.position.set(eye.x, eye.y, eye.z);
    cam.rotation.order = 'YXZ';
    cam.rotation.y = -walker.yaw;
    cam.rotation.x = walker.pitch;
    cam.rotation.z = 0;
  } else {
    const CDIST = 7;
    const cx = player.x - Math.sin(player.angle) * CDIST;
    const cy = Math.max(roadY + 1.2, roadY + 0.5 + 2.7 + camBumpPos);
    const cz = player.z + Math.cos(player.angle) * CDIST;
    cam.position.set(cx, cy, cz);
    cam.lookAt(player.x, roadY + 0.5 + 0.7, player.z);
  }

  if (starsMesh) starsMesh.position.copy(cam.position);

  hudEl.textContent = walkMode ? '' : Math.round(SLEN * 134 * player.speed * effectiveMul) + ' MPH';
  _zoneHudEl.textContent = `L${currentLevel}  ${_ZONE_LABEL[zoneTypes[player?.seg ?? 0]] ?? ''}`;
  if (!walkMode) drawGauges();
  Minimap.update(path, player.seg, player.x, player.z, player.angle);
  _dbgUpdateRings();
  { const _fms = performance.now() - _ft0;
    const _pc  = renderer.info.programs?.length ?? 0;
    const _sc  = scene.children.length;
    _dbgFrameN++;
    if (_pc !== _dbgLastProg) { _DBG.log(`SHADER_PROG\tcount=${_pc}\twas=${_dbgLastProg}\tseg=${player?.seg}\tzone=${zoneTypes[player?.seg]??'?'}`); _dbgLastProg = _pc; }
    if (_sc !== _dbgLastScene) { _DBG.log(`SCENE_SIZE\tchildren=${_sc}\tdelta=${_sc-_dbgLastScene}\tseg=${player?.seg}\tzone=${zoneTypes[player?.seg]??'?'}`); _dbgLastScene = _sc; }
    if (_fms > 8) _DBG.log(`STUTTER_L2\tms=${_fms.toFixed(1)}\tseg=${player?.seg}\tzone=${zoneTypes[player?.seg]??'?'}\tprogs=${_pc}\tscene=${_sc}\tqueue=${_decoQueue.pending}\tdeco=${decoFrontier}\tpick=${pickupFrontier}`);
    if (_dbgFrameN % 60 === 0) _DBG.log(`FRAME_L2\tms=${_fms.toFixed(1)}\tseg=${player?.seg}\tzone=${zoneTypes[player?.seg]??'?'}\tprogs=${_pc}\tscene=${_sc}\tqueue=${_decoQueue.pending}\tdeco=${decoFrontier}\tpick=${pickupFrontier}`); }
  renderer.render(scene, cam);
}
</script>
